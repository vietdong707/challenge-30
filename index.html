<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F1F4F9"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Challenge 30"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Challenge 30 ngày</title>
<meta name="robots" content="noindex">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column. A 30-tick lane ruler under the big day count ties the Today and Calendar views together; fixed bottom tab bar. */
:root{
  --bg:#F1F4F9;
  --surface:#FFFFFF;
  --surface-2:#E6EBF3;
  --ink:#0E1626;
  --ink-2:#4A5568;
  --line:#D3DAE6;
  --accent:#2145E6;
  --accent-soft:#D9E2FF;
  --part:#A8BBFF;
  --on-accent:#FFFFFF;
  --warn:#B8420F;
  --warn-soft:#FBE3D6;
  --m1:#FFF8E6;--m1b:#F4E9C2;--m2:#EBF7F1;--m2b:#CFEBDD;--m3:#F1EFFC;--m3b:#DFDAF5;
  --c1:#2145E6;--c1s:#D9E2FF;
  --c2:#0B7F57;--c2s:#D2F1E3;
  --c3:#B8540A;--c3s:#FBE2CB;
  --font-display:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --font-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --fs-xs:.75rem;
  --fs-sm:.875rem;
  --fs-md:1rem;
  --fs-lg:1.25rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B101A;
    --surface:#141B29;
    --surface-2:#1E2738;
    --ink:#E8EEFA;
    --ink-2:#9FACC2;
    --line:#2B3548;
    --accent:#7691FF;
    --accent-soft:#1C2A5A;--part:#5568C8;
    --on-accent:#0A1230;
    --warn:#FF9E72;
    --warn-soft:#3A2218;
    --m1:#2D2612;--m1b:#4A3E1C;--m2:#12302A;--m2b:#1F4A3E;--m3:#242040;--m3b:#3A3466;
    --c1:#7691FF;--c1s:#1C2A5A;
    --c2:#4FD0A0;--c2s:#133A2C;
    --c3:#FFA45C;--c3s:#3D2612;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B101A;
  --surface:#141B29;
  --surface-2:#1E2738;
  --ink:#E8EEFA;
  --ink-2:#9FACC2;
  --line:#2B3548;
  --accent:#7691FF;
  --accent-soft:#1C2A5A;--part:#5568C8;
  --on-accent:#0A1230;
  --warn:#FF9E72;
  --warn-soft:#3A2218;
  --m1:#2D2612;--m1b:#4A3E1C;--m2:#12302A;--m2b:#1F4A3E;--m3:#242040;--m3b:#3A3466;
  --c1:#7691FF;--c1s:#1C2A5A;
  --c2:#4FD0A0;--c2s:#133A2C;
  --c3:#FFA45C;--c3s:#3D2612;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:var(--fs-md);
  line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 112px;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:520px;margin:0 auto}
.view{display:flex;flex-direction:column;gap:24px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);border:0;white-space:nowrap}
.ico{display:inline-flex;width:20px;height:20px;flex:none}
.ico svg{width:100%;height:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,.task input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}

h1,h2{margin:0}
.title{font-family:var(--font-display);font-weight:700;font-size:2.5rem;line-height:1;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:700;font-size:var(--fs-lg);text-transform:uppercase;letter-spacing:.06em;text-wrap:balance}
.eyebrow{margin:0;font-size:var(--fs-xs);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
[hidden]{display:none!important}
.title.one{font-size:clamp(1.25rem,5.9vw,2.25rem);white-space:nowrap}
.cbody{display:flex;flex-direction:column;gap:10px}
.hint{margin:0;font-size:var(--fs-sm);color:var(--ink-2)}

/* Hero */
.hero{display:flex;flex-direction:column;gap:6px}
.dayrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.dayno{display:flex;align-items:baseline;gap:4px}
.daynum{font-family:var(--font-display);font-weight:700;font-size:clamp(4.5rem,22vw,6.5rem);line-height:.85;font-variant-numeric:tabular-nums}
.of{font-family:var(--font-display);font-weight:600;font-size:2rem;color:var(--ink-2)}
.stats{display:flex;gap:20px;text-align:right}
.stat b{display:block;font-family:var(--font-display);font-weight:700;font-size:2.25rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:var(--fs-xs);color:var(--ink-2)}
.lane{display:flex;align-items:flex-end;gap:2px;height:28px;margin-top:14px}
.lane i{flex:1;min-width:0;height:14px;border-radius:2px;background:var(--surface-2)}
.lane i.done{background:var(--accent)}
.lane i.part{background:linear-gradient(to top,var(--accent) calc(var(--p,0) * 100%),var(--surface-2) 0)}
.lane i.miss{background:repeating-linear-gradient(135deg,var(--surface-2) 0 3px,var(--line) 3px 5px)}
.lane i.now{height:28px;box-shadow:inset 0 0 0 2px var(--ink)}
.lane-ends{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--ink-2);font-variant-numeric:tabular-nums}

/* Notes and buttons */
.note{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:var(--fs-sm)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note span{min-width:0}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.small{min-height:40px;padding:0 14px;font-size:var(--fs-sm);flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.armed{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.btn:disabled,.iconbtn:disabled{opacity:.4;cursor:default}
.iconbtn{width:44px;height:44px;flex:none;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center}

/* Date bar */
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datetext{font-weight:600;text-align:center;min-width:0}

/* Tasks */
.section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.count{font-family:var(--font-display);font-weight:700;font-size:var(--fs-lg);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.tasks{display:grid;gap:8px}
.task{position:relative;display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 16px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s,border-color .15s}
.task .box{flex:none;width:32px;height:32px;border-radius:9px;border:2px solid var(--ink-2);display:grid;place-items:center;color:var(--on-accent);transition:background .15s,border-color .15s}
.task .box .ico{width:18px;height:18px;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
.task input:checked + .box{background:var(--accent);border-color:var(--accent)}
.task input:checked + .box .ico{opacity:1;transform:scale(1)}
.task .tname{min-width:0;overflow-wrap:anywhere;font-weight:500;font-size:1.0625rem}
.task.is-done{background:var(--accent-soft);border-color:var(--accent-soft)}
.task.is-done .tname{color:var(--ink-2)}
.task.is-locked{opacity:.6;cursor:default}
.empty{padding:20px;border:1.5px dashed var(--line);border-radius:14px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:var(--fs-xs);font-weight:600}

/* Calories */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px}
.badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:var(--fs-xs);font-weight:600;white-space:nowrap}
.badge.ok{background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.mealblock{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface)}
.calsum{gap:0}
.mealblock.m-s{background:var(--m1);border-color:var(--m1b)}
.mealblock.m-t{background:var(--m2);border-color:var(--m2b)}
.mealblock.m-e{background:var(--m3);border-color:var(--m3b)}
.mealblock .item{background:var(--surface)}
.mealblock .iname,.mealblock .iqty,.mealblock .iunit,.mealblock .ikcal{background:var(--bg)}
.mhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.mhead h3{margin:0;font-size:var(--fs-md);font-weight:600}
.mk{font-family:var(--font-display);font-weight:700;font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums}
.mk.skipped{font-family:var(--font-body);font-size:var(--fs-sm);font-weight:500;color:var(--ink-2)}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px;background:var(--bg)}
.iname,.iqty,.iunit,.ikcal{min-width:0;min-height:48px;padding:0 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
.itop{display:flex;align-items:center;gap:6px}
.itop .iname{flex:1 1 auto;width:auto;padding:0 12px}
.irow{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) minmax(0,1.3fr);gap:8px;align-items:center}
.ik{display:flex;align-items:center;gap:6px;min-width:0}
.iqty,.ikcal{width:100%;text-align:right;font-variant-numeric:tabular-nums}
.iunit{width:100%;text-align:center}
.imenu{display:flex;flex-direction:column;gap:8px;padding-top:2px}
.imenu .btn{width:100%}
.imenu p{margin:0}
.unit{color:var(--ink-2);font-size:var(--fs-sm);flex:none}
.kv{font-family:var(--font-display);font-weight:700;font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums}
.isub{margin:0;font-size:var(--fs-xs);color:var(--ink-2);min-height:1em}
.mfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.skip{display:flex;align-items:center;gap:8px;min-height:44px;font-size:var(--fs-sm);color:var(--ink-2)}
.skip input{width:22px;height:22px;accent-color:var(--accent)}
input:disabled,select:disabled{opacity:.6}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.total .lbl{font-weight:600}
.total b{font-family:var(--font-display);font-weight:700;font-size:2.25rem;line-height:1;font-variant-numeric:tabular-nums}
.total .of2{color:var(--ink-2);font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.meter{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.meter.over i{background:var(--warn)}
.calmsg{margin:8px 0 0;font-size:var(--fs-sm);color:var(--ink-2)}
.calmsg.over{color:var(--warn)}
.card .callout{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:10px;padding:12px;border-radius:12px;background:var(--surface-2)}
.card .callout .hint{color:var(--ink)}
.card .callout[hidden]{display:none}

/* Calendar */
.cal-stats{display:flex;gap:24px;flex-wrap:wrap}
.cal-stats .stat{text-align:left}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:4px}
.wk span{text-align:center;font-size:var(--fs-xs);font-weight:600;letter-spacing:.06em;color:var(--ink-2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cell{position:relative;aspect-ratio:1 / 1.2;min-width:0;max-width:100%;padding:0;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden}
.cell.blank{border:0;background:transparent}
.cell .n{font-family:var(--font-display);font-weight:700;font-size:1.375rem;line-height:1;font-variant-numeric:tabular-nums}
.cell .d{font-size:.6875rem;line-height:1;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cell .ico{position:absolute;top:3px;right:3px;width:11px;height:11px}
.cell .wdot{position:absolute;left:4px;bottom:4px;width:6px;height:6px;border-radius:50%;background:currentColor}
.cell.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cell.done .d{color:var(--on-accent);opacity:.85}
.cell.part{background:linear-gradient(to top,var(--part) calc(var(--p,0) * 100%),var(--surface) 0);border-color:var(--accent)}
.cell.part .n,.cell.part .d{color:var(--ink)}
.cell.miss{background:repeating-linear-gradient(135deg,var(--surface) 0 6px,var(--surface-2) 6px 8px)}
.cell.future{background:transparent;border-style:dashed;color:var(--ink-2)}
.cell.now{border-color:var(--ink);border-width:2.5px}
.cell.picked{outline:2.5px solid var(--accent);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:var(--fs-xs);color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface);display:inline-block}
.sw.done{background:var(--accent);border-color:var(--accent)}
.sw.part{background:linear-gradient(to top,var(--part) 55%,var(--surface) 0);border-color:var(--accent)}
.sw.miss{background:repeating-linear-gradient(135deg,var(--surface) 0 3px,var(--line) 3px 5px)}
.sw.now{border-color:var(--ink);border-width:2.5px}
.sw.picked{outline:2px solid var(--accent);outline-offset:1px}
.sw.wd{border:0;background:radial-gradient(circle,var(--ink) 0 32%,transparent 36%)}
.card.daypanel{gap:12px}
.dp-head{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.dp-title{margin:0;font-weight:600;min-width:0}
.dp-row{display:flex;align-items:center;gap:8px}
.dp-row label{flex:none;min-width:4.5rem}
.dp-row .fld{width:auto;flex:1 1 0;min-width:0}
.dp-row .fld.wf{text-align:right;font-variant-numeric:tabular-nums}
.wbox{display:flex;flex-direction:column;gap:12px}
.wchart{width:100%;height:auto;display:block}
.wchart .gl{stroke:var(--line);stroke-width:1;fill:none}
.wchart text{fill:var(--ink-2);font-size:11px;font-family:var(--font-body)}
.wchart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.wchart .pt{fill:var(--accent)}
.wchart .pt.last{stroke:var(--bg);stroke-width:2}
.tdee{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 8px}
.tdee label{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-xs);font-weight:600;color:var(--ink-2);min-width:0}
.tdee .full{grid-column:1 / -1}
.resrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.resrows .resrow:last-child{border-bottom:0}
.resrow span{min-width:0}
.resrow b{font-family:var(--font-display);font-weight:700;font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.resrow.big b{font-size:2.25rem;color:var(--accent)}
.resrow.big span:first-child{font-weight:600}
.warnline{margin:8px 0 0;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:var(--fs-sm)}

/* Edit */
.elist{display:flex;flex-direction:column;gap:8px}
.erow{display:flex;align-items:center;gap:8px}
.tinput,.fld,.sel{flex:1;min-width:0;min-height:48px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
.fld,.sel{flex:none;width:100%}
.fld-row{display:flex;align-items:center;gap:8px}
.fld-row .fld{width:9rem;text-align:right;font-variant-numeric:tabular-nums}
.fld-row span{color:var(--ink-2)}
textarea.fld{padding:10px 12px;min-height:6.5rem;resize:vertical;font-size:var(--fs-sm);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn-row.full .btn{flex:1 1 100%}
.subgroup{display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
.subgroup.first{padding-top:0;border-top:0}
.subgroup h3{margin:0;font-family:var(--font-display);font-weight:700;font-size:var(--fs-md);text-transform:uppercase;letter-spacing:.06em}
.btn-row.two{flex-wrap:nowrap}
.btn-row.two .btn{flex:1 1 0;min-width:0;padding:0 8px;line-height:1.25;text-align:center}
.btn.green{background:var(--c2);border-color:var(--c2);color:var(--on-accent)}
.bkbox{display:flex;flex-direction:column;gap:8px}
.bkrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}
.bkrow .bt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.bkrow .bt b{font-size:var(--fs-md)}
.bkrow .bt span{font-size:var(--fs-sm);color:var(--ink-2)}
.bkrow .btn{flex:none;min-height:40px;padding:0 14px}
.undo{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:560px;margin:0 auto;padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--bg);box-shadow:0 8px 24px rgba(0,0,0,.28)}
.undo .btn{flex:none;min-height:40px;background:var(--bg);color:var(--ink);border-color:var(--bg)}
.dlg-btns .btn.danger{margin-top:10px}
.btn.add{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.msg{margin:0;font-size:var(--fs-sm);color:var(--ink-2);min-height:1.5em}
.group{display:flex;flex-direction:column;gap:10px;padding-top:20px;border-top:1px solid var(--line)}
.mapbox{display:flex;flex-direction:column;gap:12px}
.mapgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 8px}
.mapgrid label{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-xs);font-weight:600;color:var(--ink-2)}
.preview{margin:0;padding:12px;list-style:none;border-radius:12px;background:var(--surface-2);font-size:var(--fs-sm);display:flex;flex-direction:column;gap:4px}

<script>
(function(){
'use strict';

const KEY='challenge30.v1';
const FKEY='challenge30.foods.v1';
const DAYS=30;
const MEALS=[{id:'s',name:'Bữa sáng'},{id:'t',name:'Bữa trưa'},{id:'e',name:'Bữa tối'}];
const ACT=[

  {v:1.9,t:'Rất nhiều (tập nặng mỗi ngày hoặc lao động chân tay)'}
];
const WD=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
const HASH={today:'cap-nhat',cal:'lich',edit:'cau-hinh'};
const MAX_FOODS=3000;
const VIEW_TOKEN=(location.hash.match(/^#xem=([A-Za-z0-9]{16,64})$/)||[])[1]||null;

/* ---------- Theme (stored on this device only) ---------- */
const TKEY='challenge30.theme';
const hostTheme=document.documentElement.getAttribute('data-theme');
function getThemePref(){
  try{ const v=localStorage.getItem(TKEY); if(v==='light'||v==='dark') return v; }catch(e){}
  return 'system';
}
function applyTheme(v){
  const r=document.documentElement;
  if(v==='light'||v==='dark') r.setAttribute('data-theme',v);

  else r.removeAttribute('data-theme');
  syncThemeColor();
}
function syncThemeColor(){
  try{
    const m=document.querySelector('meta[name="theme-color"]');

    if(c) m.setAttribute('content',c);
  }catch(e){}
}
try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncThemeColor); }catch(e){}
function setThemePref(v){
  try{ if(v==='system') localStorage.removeItem(TKEY); else localStorage.setItem(TKEY,v); }catch(e){}
  applyTheme(v);
}
applyTheme(getThemePref());

/* ---------- Dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const todayKey=()=>keyOf(new Date());
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d);};
const diffDays=(a,b)=>{const x=a.split('-').map(Number),y=b.split('-').map(Number);return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/864e5);};
const isKey=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&keyOf(parseKey(s))===s;
const fmtDM=k=>{const p=k.split('-');return p[2]+'/'+p[1];};
const fmtDMY=k=>{const p=k.split('-');return p[2]+'/'+p[1]+'/'+p[0];};
const weekday=k=>WD[parseKey(k).getDay()];
const fmtNum=n=>Number(n).toLocaleString('vi-VN',{maximumFractionDigits:1});
const newId=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- Numbers and text ---------- */
function parseNum(s){
  s=String(s==null?'':s).replace(/[^\d.,\-]/g,'');
  if(!/\d/.test(s)) return NaN;
  const hasC=s.indexOf(',')>=0,hasD=s.indexOf('.')>=0;
  if(hasC&&hasD){
    if(s.lastIndexOf(',')>s.lastIndexOf('.')) s=s.replace(/\./g,'').replace(',','.');
    else s=s.replace(/,/g,'');
  }else if(hasC){
    s=/^-?[1-9]\d{0,2}(,\d{3})+$/.test(s)?s.replace(/,/g,''):s.replace(',','.');
  }else if(hasD){
    if(/^-?[1-9]\d{0,2}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  }
  const n=Number(s);
  return isFinite(n)?n:NaN;
}
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/\s+/g,' ').trim();

/* ---------- Food table ---------- */
let FOODS=[];
let FOOD_MAP=new Map();
let SEEDED=false; // FOODS still equals the built-in table, never edited on this device
const DEFAULT_FOODS=[["Cơm trắng",100,"g",130],["Bánh hỏi",100,"g",160],["Bánh mì lát",100,"g",280],["khoai lang luộc",100,"g",90],["khoai lang nướng",100,"g",110],["Xôi trắng",100,"g",300],["Sữa đặc",100,"g",325],["Trứng gà ốp la",1,"quả",130],["Trứng vịt ốp la",1,"quả",160],["trứng luộc",1,"quả",74],["trứng ngâm tương",1,"quả",80],["Trứng ốp la",100,"g",155],["Trứng chiên",100,"g",200],["Trứng chiên thịt bằm",100,"g",220],["Cá sốt cà",100,"g",220],["Cá kho",100,"g",200],["Cá thu",100,"g",305],["Cá thu sốt cà",100,"g",240],["Cá kho bắp chuối",100,"g",220],["Cá kho dưa cải",100,"g",220],["Cá kho măng",100,"g",220],["Cá kho thịt",100,"g",250],["Canh rau",100,"g",60],["Canh củ",100,"g",90],["Canh xương",100,"g",90],["canh chua cá",100,"g",90],["Bánh Bon",1,"cái",70],["Bánh oreo",1,"cái",55],["Bánh chưng",100,"g",180],["Bánh chuối chiên",100,"g",425],["Bánh bột lọc",1,"cái",54],["Bánh hỏi không",100,"g",96],["Bánh hỏi trộn hành hẹ",100,"g",120],["Bánh bao",1,"cái",350],["Tôm",100,"g",100],["Tôm chiên bột",100,"g",300],["Tôm rim",100,"g",230],["bơ",100,"g",160],["Đậu phộng rang",100,"g",650],["Chả lụa",100,"g",230],["chả cá",100,"g",200],["chả cá xào",100,"g",180],["Heo quay",100,"g",320],["Heo quay xào cải chua",100,"g",330],["Thịt xào măng",100,"g",250],["Sườn non kho",100,"g",330],["thịt luộc",100,"g",300],["Thịt kho",100,"g",350],["thịt nạc kho",100,"g",290],["Thịt kho đậu hũ",100,"g",320],["thịt kho trứng cút",100,"g",320],["thịt kho thơm",100,"g",280],["thịt nạc kho trứng cút",100,"g",290],["Đậu hũ chiên",100,"g",270],["Đậu hũ trắng",100,"g",80],["đậu hũ cà chua thịt xay",100,"g",180],["Bê hấp",100,"g",200],["Bê xào hành",100,"g",220],["Cà phê sữa",1,"ly",160],["Cà phê muối",1,"ly",180],["cà phê đá",1,"ly",80],["cà phê gói",1,"gói",75],["đá me",1,"ly",150],["Kem",1,"cái",200],["Bia",1,"chai",144],["Ức gà luộc",100,"g",165],["Ức gà kho",100,"g",190],["Ức gà áp chảo",100,"g",190],["Thịt gà luộc",100,"g",240],["Thịt gà kho",100,"g",270],["tàu hũ nóng",1,"ly",250],["chuối sứ",100,"g",800],["chuối lùn",100,"g",900],["mực xào",100,"g",180],["mực tẩm bột chiên",100,"g",200],["cơm gà xối mỡ",1,"phần",750],["xôi gà chiên",1,"phần",550],["bún thịt xào",1,"phần",500],["trà sữa",1,"ly",400],["vịt luộc",100,"g",270],["vịt kho măng",100,"g",250],["rong biển gói",1,"gói",30],["bún",100,"g",120],["bánh cuốn",1,"phần",500],["mì quảng",1,"phần",550],["rau lang xào tỏi",100,"g",100],["Miến",100,"g",120],["Măng xào ba chỉ",100,"g",220],["thiên lý xào thịt bò",100,"g",200],["Bò xào hành",100,"g",240],["lòng luộc",100,"g",240],["bánh mì chả cá ốp la",1,"cái",650],["Mực hấp",200,"g",220]];
function cleanFood(f){
  if(!f||typeof f.n!=='string') return null;
  const b=Number(f.b),k=Number(f.k);
  if(!f.n.trim()||!isFinite(b)||b<=0||!isFinite(k)||k<0) return null;
  return {n:f.n.trim().slice(0,80),b,u:(typeof f.u==='string'&&f.u.trim()?f.u.trim():'g').slice(0,12),k};
}
function setFoods(list){
  const m=new Map();
  for(const f of list){ const c=cleanFood(f); if(c) m.set(norm(c.n),c); }
  FOODS=Array.from(m.values()).slice(0,MAX_FOODS);
  FOOD_MAP=new Map(FOODS.map(f=>[norm(f.n),f]));
}
function seedFoods(){
  if(typeof READONLY!=='undefined'&&READONLY) return;
  setFoods(DEFAULT_FOODS.map(a=>({n:a[0],b:a[1],u:a[2],k:a[3]})));
  SEEDED=true;
}
function loadFoods(){
  let raw=null;
  try{ raw=localStorage.getItem(FKEY); }catch(e){}
  if(raw===null){ seedFoods(); return; }
  try{ const a=JSON.parse(raw); if(Array.isArray(a)) setFoods(a); }catch(e){}
}
let syncHook=null;
function localSaveFoods(){
  if(READONLY) return;
  try{ localStorage.setItem(FKEY,JSON.stringify(FOODS)); }catch(e){ saveOK=false; }
}
function saveFoods(){ SEEDED=false; localSaveFoods(); if(syncHook) syncHook(); }
const lookup=name=>name?FOOD_MAP.get(norm(name)):undefined;

/* ---------- State ---------- */
const DEFAULT_TASKS=()=>[
  {id:'t1',name:'Tập luyện 30 phút',from:''},
  {id:'t2',name:'Chạy 2 km',from:''},
  {id:'t3',name:'10.000 bước chân',from:''}
];
const fresh=()=>({v:2,start:todayKey(),target:null,targetFrom:'',tasks:DEFAULT_TASKS(),days:{},weights:{},profile:{},calGoal:true,prevTarget:null});

function cleanItem(i){
  if(!i||typeof i!=='object') return null;
  return {
    id:String(i.id||newId()).slice(0,30),
    n:typeof i.n==='string'?i.n.slice(0,80):'',
    q:(typeof i.q==='number'&&isFinite(i.q)&&i.q>=0)?i.q:null,
    k:(typeof i.k==='number'&&isFinite(i.k)&&i.k>=0)?Math.round(i.k):0,
    m:!!i.m,
    ...((typeof i.u==='string'&&i.u.trim())?{u:i.u.trim().slice(0,12)}:{})
  };
}
function normalize(o){
  if(!o||typeof o!=='object'||!isKey(o.start)) return null;
  const seen=new Set();
  const tasks=[];
  if(Array.isArray(o.tasks)){
    for(const t of o.tasks){
      if(!t||typeof t.id!=='string'||typeof t.name!=='string'||seen.has(t.id)) continue;
      seen.add(t.id);
      tasks.push({id:t.id.slice(0,40),name:t.name.slice(0,80),from:isKey(t.from)?t.from:''});
      if(tasks.length>=40) break;
    }
  }
  const days={};
  if(o.days&&typeof o.days==='object'){
    for(const k of Object.keys(o.days)){
      if(!isKey(k)) continue;
      const r=o.days[k]||{};
      const done=Array.isArray(r.done)?r.done.filter(x=>typeof x==='string'):[];
      const meals={};
      if(r.meals&&typeof r.meals==='object'){
        for(const m of MEALS){
          const v=r.meals[m.id];
          if(typeof v==='number'&&isFinite(v)&&v>=0){
            // data saved by the first version: one number per meal
            meals[m.id]=v===0?{items:[],skip:true}:{items:[{id:'mig-'+m.id,n:'Tổng bữa (nhập tay)',q:null,k:Math.round(v),m:true}],skip:false};
          }else if(v&&typeof v==='object'){
            const items=Array.isArray(v.items)?v.items.slice(0,30).map(cleanItem).filter(Boolean):[];
            meals[m.id]={items,skip:!!v.skip};
          }
        }
      }
      const rec={done,meals};
      if(typeof r.tgt==='number'&&r.tgt>0) rec.tgt=Math.round(r.tgt);
      days[k]=rec;
    }
  }
  const target=(typeof o.target==='number'&&o.target>0)?Math.round(o.target):null;
  const weights={};
  if(o.weights&&typeof o.weights==='object'){
    for(const k of Object.keys(o.weights)){
      const w=o.weights[k];
      if(isKey(k)&&typeof w==='number'&&isFinite(w)&&w>=20&&w<=300) weights[k]=Math.round(w*10)/10;
    }
  }
  const pr=(o.profile&&typeof o.profile==='object')?o.profile:{};
  const profile={};
  if(pr.sex==='m'||pr.sex==='f') profile.sex=pr.sex;
  [['age',10,100],['h',100,250],['w',20,300],['def',0,1500]].forEach(a=>{ const v=pr[a[0]]; if(typeof v==='number'&&isFinite(v)&&v>=a[1]&&v<=a[2]) profile[a[0]]=v; });
  if(ACT.some(a=>a.v===pr.act)) profile.act=pr.act;
  const pt=(typeof o.prevTarget==='number'&&o.prevTarget>0)?Math.round(o.prevTarget):null;
  return {v:2,start:o.start,target,targetFrom:target?(isKey(o.targetFrom)?o.targetFrom:o.start):'',tasks,days,weights,profile,calGoal:o.calGoal!==false,prevTarget:pt};
}

}

let tab='today';

let calSel=null; // date picked in the calendar
let calWOpen=false;

/* ---------- Rules ---------- */
function calorieReq(key){
  const r=S.days[key];
  if(r&&r.tgt!==undefined) return r.tgt;
  if(S.target!==null&&key>=S.targetFrom) return S.target;

}
function setTarget(n){
  const today=todayKey();
  if(S.target!==null){
    for(const k of Object.keys(S.days)){
      const r=S.days[k];
      if(k<today&&k>=S.targetFrom&&r.tgt===undefined) r.tgt=S.target;
    }
    if(S.days[today]) delete S.days[today].tgt;
  }
  if(n===null){ S.target=null; S.targetFrom=''; }
  else{
    if(S.target===null) S.targetFrom=today>S.start?today:S.start;
    S.target=n;
  }
  save();
}
function setCalGoal(on){
  if(on===(S.calGoal!==false)) return;
  if(!on){
    const t=S.target;
    setTarget(null);
    S.calGoal=false;
    S.prevTarget=t;
  }else{
    S.calGoal=true;
    const pt=S.prevTarget;
    S.prevTarget=null;
    if(pt) setTarget(pt);
  }
  save();
}
const tasksFor=key=>S.tasks.filter(t=>!t.from||key>=t.from);
const isFilled=i=>i.k>0||(i.n.trim()!==''&&i.q!==null);

function mealInfo(r,mid){
  const md=(r.meals||{})[mid];
  const items=(md&&md.items)||[];
  const filled=items.filter(isFilled);
  const total=filled.reduce((a,i)=>a+i.k,0);
  const skip=!!(md&&md.skip);
  return {filled:filled.length,total,skip,logged:filled.length>0||skip};
}

function status(key){
  const r=S.days[key]||{};
  const done=r.done||[];
  const tasks=tasksFor(key);
  const tDone=tasks.reduce((n,t)=>n+(done.includes(t.id)?1:0),0);
  const req=calorieReq(key);
  const meals={};
  let total=0,n=0;
  for(const m of MEALS){
    const mi=mealInfo(r,m.id);
    meals[m.id]=mi;
    total+=mi.total;
    if(mi.logged) n++;
  }
  const logged=n===MEALS.length;
  const calOk=req!==null&&logged&&total<=req;
  const needed=tasks.length+(req!==null?1:0);
  const got=tDone+(calOk?1:0);
  return {tasks,done,tDone,req,total,n,logged,calOk,meals,needed,got,complete:needed>0&&got===needed};
}

function summary(){
  const today=todayKey(),end=addDays(S.start,DAYS-1);
  let best=0,run=0,count=0;
  for(let i=0;i<DAYS;i++){
    const k=addDays(S.start,i);
    if(k>today) break;
    if(status(k).complete){ run++; count++; if(run>best) best=run; } else run=0;
  }
  let cur=0;
  if(today>=S.start){
    let k=today>end?end:today;
    if(k===today&&!status(k).complete) k=addDays(k,-1);
    while(k>=S.start&&status(k).complete){ cur++; k=addDays(k,-1); }
  }
  return {cur,best,count};
}

function rec(key){
  if(!S.days[key]) S.days[key]={done:[],meals:{}};
  const r=S.days[key];
  if(!r.done) r.done=[];
  if(!r.meals) r.meals={};
  return r;
}
function ensureMeal(key,mid){
  const r=rec(key);
  if(!r.meals[mid]) r.meals[mid]={items:[],skip:false};
  if(!Array.isArray(r.meals[mid].items)) r.meals[mid].items=[];
  return r.meals[mid];
}
function dropBlankItems(key){
  const r=S.days[key];
  if(!r||!r.meals) return;
  let changed=false;
  for(const mid of Object.keys(r.meals)){
    const md=r.meals[mid];
    if(!md||!Array.isArray(md.items)) continue;
    const keep=md.items.filter(i=>i.n.trim()!==''||i.q!==null||i.k>0);
    if(keep.length!==md.items.length){ md.items=keep; changed=true; }
  }
  if(changed) save();
}
function setDone(key,id,on){
  const r=rec(key),i=r.done.indexOf(id);
  if(on&&i<0) r.done.push(id);
  if(!on&&i>=0) r.done.splice(i,1);
  save();
}
function addTask(name){
  const today=todayKey();
  const id='t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  S.tasks.push({id,name,from:today>S.start?today:S.start});
  save();
}

function latestWeight(){
  const ks=Object.keys(S.weights||{}).sort();
  return ks.length?S.weights[ks[ks.length-1]]:null;
}
function setWeight(key,v){
  if(!S.weights) S.weights={};
  if(v===null) delete S.weights[key]; else S.weights[key]=v;
  save();
}

/* ---------- DOM helpers ---------- */
function h(tag,props,...kids){
  const el=document.createElement(tag);
  if(props) for(const k of Object.keys(props)){
    const v=props[k];
    if(v===null||v===undefined||v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='text') el.textContent=v;
    else if(k.slice(0,2)==='on') el.addEventListener(k.slice(2),v);
    else if(k==='value'||k==='checked'||k==='disabled'||k==='hidden') el[k]=v;
    else el.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(Infinity)){
    if(c===null||c===undefined||c===false) continue;
    el.append(c.nodeType?c:document.createTextNode(String(c)));
  }
  return el;
}
const P={
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  left:'<path d="M14.5 6l-6 6 6 6"/>',
  right:'<path d="M9.5 6l6 6-6 6"/>',
  up:'<path d="M6 14l6-6 6 6"/>',
  down:'<path d="M6 10l6 6 6-6"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',

};
function ico(inner){
  const s=document.createElement('span');
  s.className='ico';
  s.setAttribute('aria-hidden','true');
  s.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';
  return s;
}
function arm(btn,label,armedLabel,action){
  let armed=false,t=0;
  btn.addEventListener('click',()=>{
    if(!armed){
      armed=true; btn.textContent=armedLabel; btn.classList.add('armed');
      t=setTimeout(()=>{armed=false;btn.textContent=label;btn.classList.remove('armed');},3500);
    }else{
      clearTimeout(t); armed=false; action();
    }
  });
}
function focusSoon(id){ setTimeout(()=>{const e=document.getElementById(id); if(e) e.focus();},0); }

function makeLane(){
  const el=h('div',{class:'lane',role:'img'});
  const segs=[];
  for(let i=0;i<DAYS;i++){ const s=h('i'); segs.push(s); el.append(s); }
  return {el,update(count){
    const today=todayKey();
    segs.forEach((s,i)=>{
      const k=addDays(S.start,i);
      let cls='';
      s.style.removeProperty('--p');
      if(k<=today){
        const st=status(k);
        if(st.complete) cls='done';
        else if(st.got>0){ cls='part'; s.style.setProperty('--p',String(st.got/st.needed)); }
        else if(k<today) cls='miss';
      }
      if(k===today) cls=(cls+' now').trim();
      s.className=cls;
    });
    el.setAttribute('aria-label','Tiến độ 30 ngày: '+count+' ngày đã hoàn thành');
  }};
}

    if(noteText&&after) noteText.textContent='Thử thách đã kết thúc. Bạn hoàn thành '+sm.count+'/30 ngày.';
  }

  const v=h('div',{class:'view'},h('h1',{class:'sr',text:'Cập nhật'}),hero,note,datebar,tasksSec,S.calGoal===false?null:calSec);
  refresh();
  return v;
}

function chartSVG(ks){
  const W=320,H=150,L=36,R=12,T=14,B=26;
  const pts=ks.map(k=>({x:diffDays(ks[0],k),w:S.weights[k]}));
  const span=pts[pts.length-1].x||1;
  const ws=pts.map(p=>p.w);
  const loW=Math.min.apply(null,ws),hiW=Math.max.apply(null,ws);
  let lo=loW,hi=hiW;
  if(hi-lo<1){ const m=(hi+lo)/2; lo=m-0.5; hi=m+0.5; }
  else{ const pad=(hi-lo)*0.15; lo-=pad; hi+=pad; }
  const X=x=>L+(x/span)*(W-L-R);
  const Y=w=>T+(1-(w-lo)/(hi-lo))*(H-T-B);
  const f=n=>n.toFixed(1);
  let s='<svg class="wchart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Biểu đồ cân nặng theo ngày">';
  const grid=(w)=>{
    s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+f(Y(w))+'" y2="'+f(Y(w))+'"/>';
    s+='<text x="'+(L-6)+'" y="'+f(Y(w)+4)+'" text-anchor="end">'+fmtNum(w)+'</text>';
  };
  grid(hiW);
  if(loW!==hiW) grid(loW);
  s+='<polyline class="ln" points="'+pts.map(p=>f(X(p.x))+','+f(Y(p.w))).join(' ')+'"/>';
  pts.forEach((p,i)=>{
    const last=i===pts.length-1;
    s+='<circle class="pt'+(last?' last':'')+'" cx="'+f(X(p.x))+'" cy="'+f(Y(p.w))+'" r="'+(last?5:3)+'"/>';
  });
  s+='<text x="'+L+'" y="'+(H-6)+'" text-anchor="start">'+fmtDM(ks[0])+'</text>';
  s+='<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+fmtDM(ks[ks.length-1])+'</text>';
  return s+'</svg>';
}

/* ---------- Food table import ---------- */
function parseTable(text){
  text=String(text).replace(/\r\n?/g,'\n');
  const first=text.split('\n',1)[0];
  const delim=first.indexOf('\t')>=0?'\t':first.indexOf(';')>=0?';':',';
  const rows=[];
  let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; }
      else cell+=c;
    }else if(c==='"'&&cell==='') q=true;
    else if(c===delim){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  row.push(cell); rows.push(row);
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c!=='')).slice(0,5001);
}
const looksNum=c=>/^\s*-?\d/.test(c);
function autoMap(rows){
  const head=rows[0].every(c=>!looksNum(c));
  const names=head?rows[0]:[];
  const ncol=Math.max.apply(null,rows.slice(0,50).map(r=>r.length));
  const data=head?rows.slice(1,60):rows.slice(0,60);
  const find=(re,skip)=>{ for(let i=0;i<ncol;i++){ if(skip.indexOf(i)>=0) continue; if(re.test(names[i]||'')) return i; } return -1; };
  const share=(i,wantNum)=>{ let a=0,b=0; for(const r of data){ if(r[i]===undefined||r[i]==='') continue; b++; if(looksNum(r[i])===wantNum) a++; } return b?a/b:0; };
  const firstCol=(wantNum,skip)=>{ for(let i=0;i<ncol;i++){ if(skip.indexOf(i)>=0) continue; if(share(i,wantNum)>=0.6) return i; } return -1; };
  let kcal=find(/kcal|calo|calor|năng lượng|energy/i,[]);
  let name=find(/tên|món|thực phẩm|thức ăn|name|food/i,[kcal]);
  if(kcal<0) kcal=firstCol(true,[name]);
  if(name<0) name=firstCol(false,[kcal]);
  if(name<0) name=kcal===0?1:0;
  if(kcal<0) kcal=name===0?1:0;
  const base=find(/khối lượng|định lượng|lượng|gram|serving|khẩu phần|portion|\(g\)/i,[name,kcal]);
  const unit=find(/đơn vị|unit|đvt|dvt/i,[name,kcal,base]);
  const kh=names[kcal]||'';
  const basis=/100/.test(kh)?'per100':/phần|quả|cái|serving|đơn vị|unit/i.test(kh)?'perunit':'per100';
  return {head,ncol,name,kcal,base,unit,basis};
}
function buildFoods(rows,opt){
  const out=[];
  let skipped=0;
  for(const r of (opt.head?rows.slice(1):rows)){
    const n=(r[opt.name]||'').trim();
    const k=parseNum(r[opt.kcal]);
    if(!n||!isFinite(k)||k<0){ skipped++; continue; }
    let b=opt.basis==='per100'?100:1;
    let u=opt.basis==='perunit'?'phần':'g';
    const unitCell=opt.unit>=0?(r[opt.unit]||'').trim():'';
    if(opt.base>=0){
      const cell=(r[opt.base]||'').trim();
      const m=cell.match(/^\s*([\d.,]+)\s*(.*)$/);
      const nb=m?parseNum(m[1]):NaN;
      if(!isFinite(nb)||nb<=0){ skipped++; continue; }
      b=nb; u=(m[2]||'').trim()||unitCell||'g';
    }else if(unitCell) u=unitCell;
    out.push({n:n.slice(0,80),b,u:u.slice(0,12),k});
  }
  return {foods:out,skipped};
}

/* ---------- Export (Excel) ---------- */
let xlsxLoading=null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(xlsxLoading) return xlsxLoading;
  xlsxLoading=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>{ if(window.XLSX) res(window.XLSX); else { xlsxLoading=null; rej({code:'no_lib'}); } };
    s.onerror=()=>{ xlsxLoading=null; rej({code:'no_lib'}); };
    document.head.appendChild(s);
  });
  return xlsxLoading;
}
async function saveBook(filename,sheets){
  const X=await loadXLSX();
  let dl=null;
  try{ if(window.claude&&typeof window.claude.use==='function') dl=await window.claude.use('downloads'); }catch(e){ dl=null; }
  const standalone=!window.claude;
  if(!dl&&!standalone) throw {code:'no_downloads'};
  const wb=X.utils.book_new();
  sheets.forEach(sh=>{
    const ws=X.utils.aoa_to_sheet(sh.rows);
    if(sh.widths) ws['!cols']=sh.widths.map(w=>({wch:w}));
    X.utils.book_append_sheet(wb,ws,sh.name);
  });
  const data=X.write(wb,{bookType:'xlsx',type:'array'});
  if(standalone){
    const url=URL.createObjectURL(new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
    return {status:'saved'};
  }
  return dl.save({filename,data});
}
function exportErrorText(e){
  const c=e&&e.code;
  if(c==='no_lib') return 'Chưa tải được thư viện tạo file Excel. Kiểm tra kết nối mạng rồi thử lại, hoặc dùng nút "Sao chép".';
  if(c==='no_downloads'||c==='unavailable'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed') return 'Thiết bị hoặc khung xem này không hỗ trợ tải file từ trang. Hãy dùng nút "Sao chép" rồi dán vào Excel hoặc Google Sheets.';
  if(c==='declined') return 'Bạn đã hủy lưu file.';
  if(c==='rate_limited') return 'Đang có một hộp xác nhận lưu file khác. Hãy xử lý hộp đó rồi bấm lại.';
  return 'Không lưu được file'+(c?' ('+c+')':'')+'.';
}
async function runExport(btn,msgEl,filename,sheets){
  btn.disabled=true; msgEl.textContent='Đang tạo file…';
  try{ await saveBook(filename,sheets); msgEl.textContent='Đã gửi file "'+filename+'" để lưu.'; }
  catch(e){ msgEl.textContent=exportErrorText(e); }
  btn.disabled=false;
}
const tsv=rows=>rows.map(r=>r.map(c=>String(c===null||c===undefined?'':c).replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n');
async function copyRows(rows,msgEl,fallbackEl){
  const text=tsv(rows);
  try{
    await navigator.clipboard.writeText(text);
    msgEl.textContent='Đã sao chép '+(rows.length-1)+' dòng. Dán vào Excel hoặc Google Sheets.';
  }catch(e){
    fallbackEl.hidden=false; fallbackEl.value=text; fallbackEl.focus(); fallbackEl.select();
    msgEl.textContent='Không tự sao chép được. Văn bản đã hiện trong ô bên dưới, bạn chọn hết rồi sao chép.';
  }
}

function challengeSheets(){
  const today=todayKey(),end=addDays(S.start,DAYS-1),sm=summary();
  const dayHead=['Ngày thứ','Ngày','Thứ'].concat(S.tasks.map(t=>t.name),['Calo bữa sáng','Calo bữa trưa','Calo bữa tối','Tổng calo','Mục tiêu calo','Kết quả calo','Hoàn thành ngày','Cân nặng (kg)']);
  const days=[dayHead];
  for(let i=0;i<DAYS;i++){
    const k=addDays(S.start,i),st=status(k),r=S.days[k]||{},fut=k>today;
    const row=[i+1,fmtDMY(k),weekday(k)];
    S.tasks.forEach(t=>{
      if(fut||(t.from&&k<t.from)) row.push('');
      else row.push((r.done||[]).indexOf(t.id)>=0?1:0);
    });
    MEALS.forEach(m=>{
      const mi=st.meals[m.id];
      row.push(fut?'':(mi.skip?'Bỏ bữa':(mi.filled?mi.total:'')));
    });
    row.push(fut||st.n===0?'':st.total);
    row.push(st.req===null?'':st.req);
    row.push(fut||st.req===null||!st.logged?'':(st.total<=st.req?'Đạt':'Vượt'));
    row.push(fut?'':(st.complete?'Có':'Không'));
    row.push(S.weights[k]!==undefined?S.weights[k]:'');
    days.push(row);
  }
  const dayNo=k=>{ const n=diffDays(S.start,k)+1; return (n>=1&&n<=DAYS)?n:''; };
  const items=[['Ngày thứ','Ngày','Bữa','Món','Khối lượng','Đơn vị','Calo (kcal)','Nguồn']];
  Object.keys(S.days).sort().forEach(k=>{
    const r=S.days[k];
    MEALS.forEach(m=>{
      const md=r.meals&&r.meals[m.id];
      ((md&&md.items)||[]).filter(isFilled).forEach(it=>{
        items.push([dayNo(k),fmtDMY(k),m.name,it.n,it.q===null?'':it.q,it.u||(lookup(it.n)||{}).u||'',it.k,it.m?'Nhập tay':'Từ bảng thực phẩm']);
      });
    });
  });
  const wk=Object.keys(S.weights).sort();
  const weights=[['Ngày thứ','Ngày','Thứ','Cân nặng (kg)']].concat(wk.map(k=>[dayNo(k),fmtDMY(k),weekday(k),S.weights[k]]));
  const calTxt=S.calGoal===false?'Không có mục tiêu calo':(S.target!==null?S.target:'Chưa đặt');
  const overview=[
    ['Ngày bắt đầu',fmtDMY(S.start)],
    ['Ngày kết thúc',fmtDMY(end)],
    ['Mục tiêu calo mỗi ngày (kcal)',calTxt],
    ['Số ngày hoàn thành',sm.count],
    ['Chuỗi hiện tại',sm.cur],
    ['Chuỗi dài nhất',sm.best],
    ['Cân nặng ban đầu (kg)',wk.length?S.weights[wk[0]]:''],
    ['Cân nặng mới nhất (kg)',wk.length?S.weights[wk[wk.length-1]]:''],
    ['Việc hằng ngày',S.tasks.map(t=>t.name).join('; ')],
    ['Xuất ngày',fmtDMY(today)]
  ];
  return {
    daysRows:days,
    sheets:[
      {name:'Tổng quan',rows:overview,widths:[32,40]},
      {name:'Theo ngày',rows:days,widths:[10,12,11].concat(S.tasks.map(()=>14),[14,14,14,12,13,13,15,13])},
      {name:'Món ăn',rows:items,widths:[10,12,12,30,12,12,20]},
      {name:'Cân nặng',rows:weights,widths:[10,12,11,14]}
    ]
  };
}
function exportSection(){

  const copyOut=h('textarea',{class:'fld',readonly:true,hidden:true,'aria-label':'Dữ liệu để sao chép'});

function foodsSection(){
  const PAGE=50;
  const count=h('p',{class:'hint'});
  const msg=h('p',{class:'msg'});
  const ta=h('textarea',{class:'fld',id:'food-paste',spellcheck:'false','aria-label':'Dán bảng thực phẩm',placeholder:'Dán các ô đã sao chép từ Google Sheets vào đây'});
  const readBtn=h('button',{class:'btn',type:'button'},'Đọc bảng');
  const mapBox=h('div',{class:'mapbox',hidden:true});

  // Manager: search, scroll, edit one food
  const search=h('input',{class:'fld',id:'food-search',type:'search',autocomplete:'off',placeholder:'Tìm món trong bảng','aria-label':'Tìm món trong bảng'});
  const addBtn=h('button',{class:'btn small',type:'button'},'+ Thêm món');
  const flist=h('ul',{class:'flist'});
  const fscroll=h('div',{class:'fscroll',role:'region',tabindex:'0','aria-label':'Danh sách thực phẩm'},flist);
  const fcount=h('p',{class:'hint'});
  const editBox=h('div',{class:'fedit',hidden:true});
  let matches=[],shown=PAGE;

  function paintCount(){
    count.textContent=FOODS.length
      ?'Đã có '+FOODS.length+' món. Gõ tên món ở tab Cập nhật, app sẽ gợi ý và tự tính calo theo khối lượng.'
      :'Chưa có món nào. Bạn có thể thêm từng món bằng nút bên dưới, hoặc dán bảng từ Google Sheets ở phần nhập.';
  }
  function rowFor(f){
    const b=h('button',{class:'frow',type:'button'},h('span',{class:'fn',text:f.n}),h('span',{class:'fk',text:fmtNum(f.k)+' kcal / '+fmtNum(f.b)+' '+f.u}));
    b.addEventListener('click',()=>openEditor(f));
    return h('li',{},b);
  }
  function renderRows(){
    flist.replaceChildren(...matches.slice(0,shown).map(rowFor));
    if(!matches.length) flist.append(h('li',{class:'fempty',text:FOODS.length?'Không có món nào khớp.':'Bảng đang trống.'}));
    if(shown<matches.length){
      const more=h('button',{class:'btn small fmore',type:'button'},'Hiện thêm '+Math.min(PAGE,matches.length-shown)+' món');
      more.addEventListener('click',()=>{ shown+=PAGE; renderRows(); });
      flist.append(h('li',{class:'fmorerow'},more));
    }
    fcount.textContent=FOODS.length?('Hiện '+Math.min(shown,matches.length)+'/'+matches.length+' món'+(search.value.trim()?' khớp tìm kiếm':'')):'';
  }
  function paintList(){
    const q=norm(search.value);
    matches=FOODS.filter(f=>!q||norm(f.n).indexOf(q)>=0);
    shown=PAGE;
    fscroll.scrollTop=0;
    renderRows();
  }
  fscroll.addEventListener('scroll',()=>{
    if(shown<matches.length&&fscroll.scrollTop+fscroll.clientHeight>=fscroll.scrollHeight-80){ shown+=PAGE; renderRows(); }
  });
  search.addEventListener('input',paintList);

  function closeEditor(){ editBox.hidden=true; editBox.replaceChildren(); }
  function openEditor(f){
    let dupFor=null;
    const nameI=h('input',{class:'fld',id:'fe-name',type:'text',maxlength:'80',autocomplete:'off',value:f?f.n:''});
    const baseI=h('input',{class:'fld',id:'fe-base',type:'text',inputmode:'decimal',autocomplete:'off',maxlength:'8',value:f?String(f.b).replace('.',','):'100'});
    const unitI=h('input',{class:'fld',id:'fe-unit',type:'text',maxlength:'12',autocomplete:'off',value:f?f.u:'g'});
    const kcalI=h('input',{class:'fld',id:'fe-kcal',type:'text',inputmode:'decimal',autocomplete:'off',maxlength:'8',value:f?String(f.k).replace('.',','):''});
    const emsg=h('p',{class:'msg'});
    const saveB=h('button',{class:'btn primary',type:'button'},'Lưu');
    const cancelB=h('button',{class:'btn',type:'button'},'Hủy');
    cancelB.addEventListener('click',closeEditor);
    [baseI,kcalI].forEach(i=>i.addEventListener('input',()=>{ const v=i.value.replace(/[^\d.,]/g,''); if(v!==i.value) i.value=v; }));
    saveB.addEventListener('click',()=>{
      const n=nameI.value.trim(),b=parseNum(baseI.value),k=parseNum(kcalI.value),u=unitI.value.trim()||'g';
      if(!n){ emsg.textContent='Nhập tên món.'; return; }
      if(!(isFinite(b)&&b>0)){ emsg.textContent='Khối lượng chuẩn phải lớn hơn 0.'; return; }
      if(!(isFinite(k)&&k>=0)){ emsg.textContent='Calo phải là số từ 0 trở lên.'; return; }
      if(!f&&FOODS.length>=MAX_FOODS){ emsg.textContent='Bảng đã đủ '+fmtNum(MAX_FOODS)+' món. Hãy xóa bớt trước khi thêm.'; return; }
      const dup=FOODS.find(x=>x!==f&&norm(x.n)===norm(n));
      if(dup&&dupFor!==dup){
        dupFor=dup;
        emsg.textContent='Đã có món "'+dup.n+'". Bấm Ghi đè để thay món đó bằng nội dung này.';
        saveB.textContent='Ghi đè';
        return;
      }
      const item={n:n.slice(0,80),b,u:u.slice(0,12),k};
      let next=FOODS.slice();
      if(f) next[next.indexOf(f)]=item; else next.push(item);
      if(dup) next=next.filter(x=>x!==dup);
      setFoods(next); saveFoods();
      closeEditor();
      search.value=item.n;
      paintList(); paintCount();
      msg.textContent='Đã lưu món "'+item.n+'".';
    });
    const delB=f?h('button',{class:'btn danger',type:'button'},'Xóa món'):null;
    if(delB) arm(delB,'Xóa món','Chắc chắn xóa?',()=>{
      setFoods(FOODS.filter(x=>x!==f)); saveFoods();
      closeEditor(); paintList(); paintCount();
      msg.textContent='Đã xóa món "'+f.n+'".';
    });
    editBox.replaceChildren(
      h('h3',{class:'fh',text:f?'Sửa món':'Thêm món mới'}),
      h('div',{class:'fgrid'},
        h('label',{class:'full',for:'fe-name'},'Tên món',nameI),
        h('label',{for:'fe-base'},'Khối lượng chuẩn',baseI),
        h('label',{for:'fe-unit'},'Đơn vị',unitI),
        h('label',{class:'full',for:'fe-kcal'},'Calo (kcal) cho khối lượng chuẩn',kcalI)),
      emsg,
      h('div',{class:'btn-row two'},saveB,cancelB,delB));
    editBox.hidden=false;
    if(editBox.scrollIntoView) try{ editBox.scrollIntoView({block:'nearest'}); }catch(e){}
    nameI.focus();
  }
  addBtn.addEventListener('click',()=>openEditor(null));
  paintCount();
  paintList();

  readBtn.addEventListener('click',()=>{
    msg.textContent='';
    const rows=parseTable(ta.value);
    if(!rows.length){ msg.textContent='Chưa có dữ liệu. Hãy dán bảng vào ô phía trên.'; mapBox.hidden=true; return; }
    const auto=autoMap(rows);
    if(auto.ncol<2){ msg.textContent='Bảng cần ít nhất 2 cột: tên món và calo.'; mapBox.hidden=true; return; }
    const colName=i=>(auto.head&&rows[0][i])?rows[0][i]:'Cột '+String.fromCharCode(65+(i%26));
    const opts=none=>{
      const a=[];
      if(none) a.push(h('option',{value:'-1',text:'Không có'}));
      for(let i=0;i<auto.ncol;i++) a.push(h('option',{value:String(i),text:colName(i).slice(0,40)}));
      return a;
    };
    const mk=(id,label,none,val)=>{ const s=h('select',{class:'sel',id},opts(none)); s.value=String(val); return {s,wrap:h('label',{for:id},label,s)}; };
    const cName=mk('map-name','Cột tên món',false,auto.name);
    const cKcal=mk('map-kcal','Cột calo (kcal)',false,auto.kcal);
    const cBase=mk('map-base','Cột khối lượng chuẩn (nếu có)',true,auto.base);
    const cUnit=mk('map-unit','Cột đơn vị (nếu có)',true,auto.unit);
    const sBasis=h('select',{class:'sel',id:'map-basis'},
      h('option',{value:'per100',text:'100 g hoặc 100 ml'}),
      h('option',{value:'per1',text:'1 g hoặc 1 ml'}),
      h('option',{value:'perunit',text:'1 phần, 1 quả, 1 cái'}));
    sBasis.value=auto.basis;
    const sMode=h('select',{class:'sel',id:'map-mode'},
      h('option',{value:'replace',text:'Thay thế bảng hiện có'}),
      h('option',{value:'merge',text:'Gộp thêm vào bảng hiện có'}));
    const preview=h('ul',{class:'preview'});
    const importBtn=h('button',{class:'btn primary',type:'button'});
    let cur={foods:[],skipped:0};
    function recompute(){
      sBasis.disabled=cBase.s.value!=='-1';
      cur=buildFoods(rows,{head:auto.head,name:+cName.s.value,kcal:+cKcal.s.value,base:+cBase.s.value,unit:+cUnit.s.value,basis:sBasis.value});
      preview.replaceChildren(...cur.foods.slice(0,4).map(f=>h('li',{text:f.n+': '+fmtNum(f.k)+' kcal / '+fmtNum(f.b)+' '+f.u})));
      if(!cur.foods.length) preview.append(h('li',{text:'Chưa đọc được món nào. Hãy kiểm tra lại các cột đã chọn.'}));
      if(cur.skipped) preview.append(h('li',{text:'Bỏ qua '+cur.skipped+' dòng thiếu tên hoặc calo.'}));
      importBtn.textContent='Nhập '+cur.foods.length+' món';
      importBtn.disabled=!cur.foods.length;
    }
    [cName.s,cKcal.s,cBase.s,cUnit.s,sBasis].forEach(s=>s.addEventListener('change',recompute));
    importBtn.addEventListener('click',()=>{
      const merged=sMode.value==='merge'?FOODS.concat(cur.foods):cur.foods;
      setFoods(merged); saveFoods();
      const n=cur.foods.length;
      ta.value=''; mapBox.hidden=true; mapBox.replaceChildren();
      closeEditor(); paintCount(); paintList();
      msg.textContent='Đã nhập '+n+' món. Bảng hiện có '+FOODS.length+' món.';
    });
    mapBox.replaceChildren(
      h('p',{class:'hint',text:'Kiểm tra các cột app đã nhận. Phần xem trước cho biết calo được hiểu theo khối lượng nào.'}),
      h('div',{class:'mapgrid'},cName.wrap,cKcal.wrap,cBase.wrap,cUnit.wrap,
        h('label',{for:'map-basis'},'Calo ghi theo (khi không có cột khối lượng)',sBasis),
        h('label',{for:'map-mode'},'Cách nhập',sMode)),
      preview,importBtn);
    mapBox.hidden=false;
    recompute();
  });

  // Export
  const expMsg=h('p',{class:'msg'});
  const copyOut=h('textarea',{class:'fld',readonly:true,hidden:true,'aria-label':'Dữ liệu để sao chép'});
  const expBtn=h('button',{class:'btn',type:'button'},'Xuất Excel');
  expBtn.addEventListener('click',()=>{
    if(!FOODS.length){ expMsg.textContent='Bảng đang trống, chưa có gì để xuất.'; return; }
    runExport(expBtn,expMsg,'bang-thuc-pham-'+todayKey()+'.xlsx',[{name:'Thực phẩm',rows:foodRows(),widths:[34,18,10,14]}]);
  });
  const copyBtn=h('button',{class:'btn',type:'button'},'Sao chép bảng');
  copyBtn.addEventListener('click',()=>{
    if(!FOODS.length){ expMsg.textContent='Bảng đang trống, chưa có gì để sao chép.'; return; }
    copyRows(foodRows(),expMsg,copyOut);
  });

  const defMsg=h('p',{class:'msg'});
  const defBtn=h('button',{class:'btn add',type:'button'},'Nạp bảng mặc định');
  defBtn.addEventListener('click',()=>{
    const have=new Set(FOODS.map(f=>norm(f.n)));
    const extra=DEFAULT_FOODS.filter(a=>!have.has(norm(a[0]))).map(a=>({n:a[0],b:a[1],u:a[2],k:a[3]}));
    if(!extra.length){ defMsg.textContent='Bảng đã có đủ các món mặc định.'; return; }
    if(FOODS.length+extra.length>MAX_FOODS){ defMsg.textContent='Bảng đã gần đầy, không nạp thêm được.'; return; }
    setFoods(FOODS.concat(extra)); saveFoods(); closeEditor(); paintList(); paintCount();
    defMsg.textContent='Đã thêm '+extra.length+' món mới. Món trùng tên giữ nguyên số liệu của bạn. Bảng hiện có '+FOODS.length+' món.';
  });
  const clearBtn=h('button',{class:'btn danger',type:'button'},'Xóa bảng thực phẩm');
  arm(clearBtn,'Xóa bảng thực phẩm','Chắc chắn xóa bảng?',()=>{ setFoods([]); saveFoods(); closeEditor(); paintList(); paintCount(); msg.textContent='Đã xóa bảng thực phẩm.'; });

  return h('section',{class:'group','aria-labelledby':'h-foods'},
    h('h2',{id:'h-foods',text:'Bảng thực phẩm'}),
    count,
    h('div',{class:'fman'},
      h('div',{class:'fsearch'},search,addBtn),
      editBox,
      fscroll,
      fcount),
    h('div',{class:'btn-row full'},defBtn),
    defMsg,
    h('p',{class:'eyebrow',text:'Nhập từ Google Sheets hoặc Excel'}),
    h('p',{class:'hint',text:'App không nối trực tiếp với Google Sheets được. Khi bảng thay đổi, bạn sao chép các ô rồi dán vào đây. Chọn "Gộp thêm" để cập nhật món trùng tên và thêm món mới mà không mất món cũ.'}),
    ta,
    h('div',{class:'btn-row full'},readBtn),
    mapBox,msg,
    h('p',{class:'eyebrow',text:'Xuất bảng thực phẩm'}),
    h('div',{class:'btn-row two'},expBtn,copyBtn),
    expMsg,copyOut,
    h('div',{class:'btn-row full'},clearBtn));
}

function tdeeSection(onApply){
  if(!S.profile) S.profile={};
  const p=S.profile;
  const field=(id,max,val)=>h('input',{class:'fld',id,type:'text',inputmode:'decimal',autocomplete:'off',maxlength:String(max),value:val===undefined?'':String(val).replace('.',',')});
  const sexS=h('select',{class:'sel',id:'td-sex'},h('option',{value:'',text:'Chọn'}),h('option',{value:'m',text:'Nam'}),h('option',{value:'f',text:'Nữ'}));
  sexS.value=p.sex||'';
  const ageI=field('td-age',3,p.age),hI=field('td-h',5,p.h),wI=field('td-w',6,p.w),dI=field('td-def',5,p.def===undefined?500:p.def);
  const actS=h('select',{class:'sel',id:'td-act'},ACT.map(a=>h('option',{value:String(a.v),text:a.t})));
  actS.value=String(p.act||1.55);
  const bmrV=h('b'),tdeeV=h('b'),tgtV=h('b'),tgtL=h('span');
  const rows=h('div',{class:'resrows'},
    h('div',{class:'resrow'},h('span',{text:'BMR, năng lượng khi nghỉ'}),h('span',{},bmrV,' kcal')),
    h('div',{class:'resrow'},h('span',{text:'TDEE, tiêu hao mỗi ngày'}),h('span',{},tdeeV,' kcal')),
    h('div',{class:'resrow big'},tgtL,h('span',{},tgtV,' kcal')));
  const warn=h('p',{class:'warnline',hidden:true});
  const box=h('div',{class:'card',hidden:true},rows,warn);
  const need=h('p',{class:'hint'});
  const note=h('p',{class:'hint'});
  const applyBtn=h('button',{class:'btn primary',type:'button',disabled:true},'Đặt làm mục tiêu calo');
  const msg=h('p',{class:'msg'});
  let cur=null;

  function read(){
    const num=(el,lo,hi)=>{ const n=parseNum(el.value); return (isFinite(n)&&n>=lo&&n<=hi)?n:undefined; };
    const defRaw=dI.value.trim();
    return {sex:sexS.value||undefined,age:num(ageI,10,100),h:num(hI,100,250),w:num(wI,20,300),act:Number(actS.value),def:defRaw===''?500:num(dI,0,1500),defRaw};
  }
  function paint(){
    const r=read(),lw=latestWeight();
    wI.placeholder=lw!==null?fmtNum(lw)+' (cân gần nhất)':'kg';
    const w=r.w!==undefined?r.w:(lw!==null?lw:undefined);
    const ok=!!r.sex&&r.age!==undefined&&r.h!==undefined&&w!==undefined&&r.def!==undefined;
    const d=r.def!==undefined?r.def:500;
    tgtL.textContent=d>0?'Mục tiêu = TDEE − '+fmtNum(d):'Mục tiêu = TDEE';
    note.textContent=(d>0
      ?'Thiếu hụt '+fmtNum(d)+' kcal mỗi ngày tương ứng giảm khoảng '+(Math.round(d*7/7700*100)/100).toLocaleString('vi-VN',{maximumFractionDigits:2})+' kg mỗi tuần. '
      :'Giữ đúng TDEE nghĩa là giữ nguyên cân nặng. ')
      +'Đây chỉ là ước tính. Nếu bạn có bệnh lý, đang mang thai hoặc cho con bú, hãy hỏi bác sĩ hoặc chuyên gia dinh dưỡng trước khi ăn kiêng.';
    need.textContent=r.def===undefined
      ?'Mức giảm cần là số từ 0 đến 1.500 kcal. Để trống thì app dùng 500.'
      :'Nhập đủ giới tính, tuổi, chiều cao và cân nặng để tính. Nếu bỏ trống cân nặng, app dùng số cân gần nhất bạn đã ghi ở tab Lịch.';
    box.hidden=!ok; need.hidden=ok; warn.hidden=true; applyBtn.disabled=true; cur=null;
    if(!ok) return;
    const bmr=10*w+6.25*r.h-5*r.age+(r.sex==='m'?5:-161);
    const tdee=bmr*r.act;
    const target=Math.round(tdee)-d;
    cur=target;
    bmrV.textContent=fmtNum(Math.round(bmr));
    tdeeV.textContent=fmtNum(Math.round(tdee));
    tgtV.textContent=fmtNum(target);
    const min=r.sex==='m'?1500:1200;
    const lines=[];
    if(target<min) lines.push('Mục tiêu này thấp hơn mức tối thiểu thường được khuyến nghị ('+fmtNum(min)+' kcal với '+(r.sex==='m'?'nam':'nữ')+').');
    if(d>1000) lines.push('Mức giảm trên 1.000 kcal mỗi ngày khá mạnh.');
    if(lines.length){ warn.textContent=lines.join(' ')+' Nên hỏi chuyên gia dinh dưỡng trước khi áp dụng.'; warn.hidden=false; }
    applyBtn.disabled=target<=0;
  }
  function sync(){
    const r=read();
    ['sex','age','h','w'].forEach(f=>{ if(r[f]===undefined) delete p[f]; else p[f]=r[f]; });
    if(r.defRaw===''||r.def===undefined) delete p.def; else p.def=r.def;
    p.act=r.act;
    save(); paint(); msg.textContent='';
  }
  [ageI,hI,wI,dI].forEach(i=>i.addEventListener('input',()=>{
    const v=i.value.replace(/[^\d.,]/g,'');
    if(v!==i.value) i.value=v;
    sync();
  }));
  sexS.addEventListener('change',sync);
  actS.addEventListener('change',sync);
  applyBtn.addEventListener('click',()=>{
    if(cur===null||cur<=0) return;
    onApply(cur);
    msg.textContent='Đã đặt mục tiêu calo '+fmtNum(cur)+' kcal mỗi ngày.';
  });
  paint();

  return h('section',{class:'group','aria-labelledby':'h-tdee'},
    h('h2',{id:'h-tdee',text:'Tính mục tiêu calo'}),
    h('p',{class:'hint',text:'Mục tiêu calo = TDEE trừ đi số kcal bạn chọn (mặc định 500). TDEE là tổng năng lượng cơ thể tiêu hao trong ngày, tính theo công thức Mifflin-St Jeor nhân với hệ số vận động.'}),
    h('div',{class:'tdee'},
      h('label',{for:'td-sex'},'Giới tính',sexS),
      h('label',{for:'td-age'},'Tuổi',ageI),
      h('label',{for:'td-h'},'Chiều cao (cm)',hI),
      h('label',{for:'td-w'},'Cân nặng (kg)',wI),
      h('label',{class:'full',for:'td-act'},'Mức vận động',actS),
      h('label',{class:'full',for:'td-def'},'Giảm so với TDEE (kcal mỗi ngày)',dI)),
    need,box,
    h('div',{class:'btn-row full'},applyBtn),
    msg,
    note);
}

const OPEN={list:false,foods:false,tdee:false,exp:false,acc:false,share:false,backup:false,theme:false,danger:false};
function collapsible(sec,key){
  const hd=sec.querySelector('h2');
  const body=h('div',{class:'cbody',id:'body-'+key});
  Array.from(sec.children).filter(c=>c!==hd).forEach(c=>body.append(c));
  const btn=h('button',{class:'btn small',type:'button','aria-controls':'body-'+key});
  const paint=()=>{ body.hidden=!OPEN[key]; btn.textContent=OPEN[key]?'Thu gọn':'Mở rộng'; btn.setAttribute('aria-expanded',OPEN[key]?'true':'false'); };
  btn.addEventListener('click',()=>{ OPEN[key]=!OPEN[key]; paint(); });
  paint();
  sec.append(h('div',{class:'sec-head'},hd,btn),body);
  return sec;
}

function viewEdit(){
  // Task list
  const list=h('div',{class:'elist'});

/* ---------- Cloud sync (Firestore) ---------- */
// Documents: cfg/main, days/<date>, weights/<date>, foods/f00... Each device writes only the documents it changed.
const SYNC={unsubs:[],db:null,ready:false,writing:false,timer:0,retry:0,offT:0,state:'local',last:new Map(),boot:new Map(),first:{cfg:false,days:false,weights:false,foods:false}};
const SYNC_TXT={
  local:'Chỉ lưu trên máy này',
  connecting:'Đang kết nối để đồng bộ…',
  ok:'Đã đồng bộ',
  saving:'Đang lưu…',
  offline:'Chưa kết nối được. Dữ liệu đang lưu tạm trên máy này.',
  error:'Chưa lưu lên máy chủ được. Dữ liệu vẫn nằm trên máy này.',
  full:'Đã hết hạn mức đồng bộ hôm nay. Dữ liệu vẫn nằm trên máy này.',
  denied:'Quy tắc bảo mật của Firebase chưa cho phép lưu. Dữ liệu vẫn nằm trên máy này.',
  nosdk:'Chưa tải được dịch vụ đồng bộ (có thể đang mất mạng). Dữ liệu vẫn lưu trên máy này.',
  choose:'Đang chờ bạn chọn cách đồng bộ…'
};
SYNC.ok=()=>SYNC.state==='ok'||SYNC.state==='saving';
function setSyncState(s){
  SYNC.state=s;
  const el=document.getElementById('sync');
  if(!el) return;
  el.setAttribute('data-s',s);
  const t=document.getElementById('sync-t');
  const who=(FB.user&&s!=='local'&&s!=='nosdk')?((FB.user.email||FB.user.displayName||'')+' · '):'';
  if(t) t.textContent=who+(SYNC_TXT[s]||'');
}
function canon(v){
  if(Array.isArray(v)) return '['+v.map(canon).join(',')+']';
  if(v&&typeof v==='object') return '{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';
  return JSON.stringify(v===undefined?null:v);
}
const CHUNK=300;
function localDocs(){
  const m=new Map();
  m.set('cfg/main',{v:2,start:S.start,target:S.target,targetFrom:S.targetFrom,tasks:S.tasks,profile:S.profile||{},calGoal:S.calGoal!==false,prevTarget:S.prevTarget||null});
  Object.keys(S.days).forEach(k=>m.set('days/'+k,S.days[k]));
  Object.keys(S.weights||{}).forEach(k=>m.set('weights/'+k,{kg:S.weights[k]}));
  const n=Math.ceil(FOODS.length/CHUNK);
  for(let i=0;i<n;i++) m.set('foods/f'+pad(i),{items:FOODS.slice(i*CHUNK,(i+1)*CHUNK)});
  return m;
}
SYNC.boot=new Map(Array.from(localDocs()).map(e=>[e[0],canon(e[1])]));

// What a document looked like when this device last agreed with the server.
function baseline(path){
  if(SYNC.last.has(path)) return SYNC.last.get(path);
  return SYNC.ready?undefined:SYNC.boot.get(path);
}
function dirtyPath(path,docs){
  const d=docs.get(path);
  return (d===undefined?undefined:canon(d))!==baseline(path);
}
function dirtyPrefix(prefix,docs){
  const keys=new Set();
  const add=(_,p)=>{ if(p.indexOf(prefix)===0) keys.add(p); };
  docs.forEach(add); SYNC.last.forEach(add);
  if(!SYNC.ready) SYNC.boot.forEach(add);
  for(const p of keys) if(dirtyPath(p,docs)) return true;
  return false;
}

/* Remote -> this device */
function busy(){
  const a=document.activeElement;
  if(a&&mainEl.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
  if(tab==='edit'){
    const t=document.getElementById('food-paste'),b=document.getElementById('backup');
    if((t&&t.value)||(b&&b.value)) return true;
  }
  return false;
}
let renderPending=false;
function scheduleRender(){
  if(busy()){ renderPending=true; return; }
  renderPending=false; render();
}
mainEl.addEventListener('focusout',()=>setTimeout(()=>{ if(renderPending) scheduleRender(); },60));

function finish(name,snap,changed){
  if(changed){ localSave(); scheduleRender(); }
  if(!snap.metadata.fromCache&&!SYNC.first[name]){
    SYNC.first[name]=true;
    if(!SYNC.ready&&SYNC.first.cfg&&SYNC.first.days&&SYNC.first.weights&&SYNC.first.foods) becomeReady();
  }
}
function applyCfg(path,data,docs){
  if(!data||canon(data)===SYNC.last.get(path)||dirtyPath(path,docs)) return false;
  const n=normalize({v:2,start:data.start,target:data.target,targetFrom:data.targetFrom,tasks:data.tasks,profile:data.profile,calGoal:data.calGoal,prevTarget:data.prevTarget,days:{},weights:{}});
  if(!n) return false;
  const before=canon(docs.get(path));
  S.start=n.start;S.target=n.target;S.targetFrom=n.targetFrom;S.tasks=n.tasks;S.profile=n.profile;S.calGoal=n.calGoal;S.prevTarget=n.prevTarget;
  const after=canon(localDocs().get(path));
  SYNC.last.set(path,after); SYNC.boot.delete(path);
  return before!==after;
}
function onCfg(snap){
  let changed=false;
  if(snap.exists) changed=applyCfg('cfg/main',snap.data(),localDocs());
  finish('cfg',snap,changed);
}
function applyDay(id,data){
  if(!isKey(id)) return null;
  const n=normalize({start:S.start,days:{[id]:data}});
  const d=n&&n.days[id];
  if(!d) return null;
  const same=!!S.days[id]&&canon(S.days[id])===canon(d);
  S.days[id]=d;
  return !same;
}
function removeDay(id){ if(S.days[id]){ delete S.days[id]; return true; } return false; }
function applyWeight(id,data){
  const kg=data&&data.kg;
  if(!isKey(id)||typeof kg!=='number'||!isFinite(kg)||kg<20||kg>300) return null;
  const v=Math.round(kg*10)/10;
  const same=S.weights[id]===v;
  S.weights[id]=v;
  return !same;
}
function removeWeight(id){ if(S.weights[id]!==undefined){ delete S.weights[id]; return true; } return false; }
function syncDocs(prefix,snap,apply,remove){
  const docs=localDocs();
  let changed=false;
  snap.docChanges().forEach(ch=>{
    const id=ch.doc.id,path=prefix+'/'+id;
    if(ch.type==='removed'){
      if(dirtyPath(path,docs)) return;
      if(remove(id)) changed=true;
      SYNC.last.delete(path); SYNC.boot.delete(path);
      return;
    }
    const data=ch.doc.data();
    if(!data||canon(data)===SYNC.last.get(path)||dirtyPath(path,docs)) return;
    const r=apply(id,data);
    if(r===null) return;
    if(r) changed=true;
    SYNC.last.set(path,canon(localDocs().get(path))); SYNC.boot.delete(path);
  });
  return changed;
}
function onDays(snap){ finish('days',snap,syncDocs('days',snap,applyDay,removeDay)); }
function onWeights(snap){ finish('weights',snap,syncDocs('weights',snap,applyWeight,removeWeight)); }
function onFoods(snap){
  let changed=false;
  const docs=localDocs();
  const arr=snap.docs.slice().sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);
  if(!dirtyPrefix('foods/',docs)&&(SYNC.ready||arr.length)&&!(SEEDED&&!arr.length)){
    const items=[];
    arr.forEach(d=>{ const x=d.data(); if(x&&Array.isArray(x.items)) x.items.forEach(i=>items.push(i)); });
    const before=canon(FOODS);
    setFoods(items); SEEDED=false;
    if(canon(FOODS)!==before){ localSaveFoods(); changed=true; }
    Array.from(SYNC.last.keys()).forEach(p=>{ if(p.indexOf('foods/')===0) SYNC.last.delete(p); });
    Array.from(SYNC.boot.keys()).forEach(p=>{ if(p.indexOf('foods/')===0) SYNC.boot.delete(p); });
    localDocs().forEach((d,p)=>{ if(p.indexOf('foods/')===0) SYNC.last.set(p,canon(d)); });
  }
  finish('foods',snap,changed);
}

/* This device -> server */
function becomeReady(){
  SYNC.ready=true;
  clearTimeout(SYNC.offT);
  SYNC.boot=new Map();
  flush();
}
async function flush(){
  if(!SYNC.ready||SYNC.writing||!SYNC.db) return;
  SYNC.writing=true;
  let fail=null;
  try{
    for(let round=0;round<20;round++){
      const docs=localDocs();
      const ops=[];
      docs.forEach((data,path)=>{ const j=canon(data); if(SYNC.last.get(path)!==j) ops.push({path,j}); });
      SYNC.last.forEach((_,path)=>{ if(!docs.has(path)) ops.push({path,del:true}); });
      if(!ops.length) break;
      setSyncState('saving');
      for(const op of ops){
        if(!SYNC.db) throw {code:'stopped'};
        const ref=SYNC.db.doc(op.path);
        if(op.del){ await ref.delete(); SYNC.last.delete(op.path); }
        else{ await ref.set(JSON.parse(op.j)); SYNC.last.set(op.path,op.j); }
      }
    }
  }catch(e){ fail=e||{}; }
  SYNC.writing=false;
  if(!fail){ setSyncState('ok'); return; }
  const code=fail.code;
  if(code==='stopped') return;
  if(code==='resource-exhausted'){ setSyncState('full'); clearTimeout(SYNC.retry); SYNC.retry=setTimeout(flush,600000); return; }
  if(code==='permission-denied'){ setSyncState('denied'); return; }
  setSyncState('error');
  if(code==='unavailable'){
    clearTimeout(SYNC.retry);
    SYNC.retry=setTimeout(flush,6000);
  }
}
syncHook=function(){
  if(!SYNC.db||!SYNC.ready) return;
  setSyncState('saving');
  clearTimeout(SYNC.timer);
  SYNC.timer=setTimeout(flush,700);
};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&SYNC.ready){ clearTimeout(SYNC.timer); flush(); }
});

function authChanged(){ paintAuthUI(); if(tab==='edit') scheduleRender(); }
function authErr(e){
  const c=(e&&e.code)||'';
  if(c==='auth/popup-blocked') return 'Trình duyệt đã chặn cửa sổ đăng nhập. Hãy cho phép cửa sổ bật lên (pop-up) cho trang này rồi bấm lại.';
  if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request') return 'Bạn đã đóng cửa sổ đăng nhập.';
  if(c==='auth/unauthorized-domain') return 'Tên miền của trang này chưa được thêm vào danh sách cho phép trong Firebase (Authorized domains).';
  if(c==='auth/operation-not-allowed') return 'Đăng nhập bằng Google chưa được bật trong Firebase.';
  if(c==='auth/network-request-failed') return 'Không có kết nối mạng. Hãy thử lại khi có mạng.';
  return 'Không đăng nhập được'+(c?' ('+c+')':'')+'. Nếu bạn đang mở trong Zalo hoặc Facebook, hãy mở bằng Chrome hoặc Safari.';
}

function loadFB(){
  if(FB.mods) return Promise.resolve(FB.mods);
  if(FB.loading) return FB.loading;
  FB.loading=(async()=>{
    try{
      let m;
      if(window.__fbMock) m=window.__fbMock;
      else{
        const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
        const parts=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
        m=Object.assign({},parts[0],parts[1],parts[2]);
      }
      const app=m.initializeApp(FIREBASE_CONFIG);
      if(READONLY){ FB.fs=m.getFirestore(app); }
      else{
        FB.auth=m.getAuth(app);
        try{ FB.fs=m.initializeFirestore(app,{localCache:m.persistentLocalCache({tabManager:m.persistentMultipleTabManager()})}); }
        catch(e){ FB.fs=m.getFirestore(app); }
      }
      FB.mods=m;
      return m;
    }catch(e){ FB.loading=null; throw e; }
  })();
  return FB.loading;
}

function localHasData(){
  return Object.keys(S.days).length>0||Object.keys(S.weights||{}).length>0||(FOODS.length>0&&!SEEDED)||S.target!==null||S.calGoal===false
    ||canon(S.tasks.map(t=>t.name))!==canon(DEFAULT_TASKS().map(t=>t.name));
}
function clearLocal(){
  S=fresh(); seedFoods(); try{ localStorage.removeItem(FKEY); }catch(e){} viewKey=null; calSel=null;
  localSave();
  try{ localStorage.removeItem(BK_KEY); }catch(e){}
}
function bootNow(){ return new Map(Array.from(localDocs()).map(e=>[e[0],canon(e[1])])); }

function stopCloud(){
  (SYNC.unsubs||[]).forEach(f=>{ try{ f(); }catch(e){} });
  SYNC.unsubs=[];
  clearTimeout(SYNC.timer); clearTimeout(SYNC.retry); clearTimeout(SYNC.offT);
  SYNC.db=null; SYNC.ready=false; SYNC.writing=false;
  SYNC.last=new Map(); SYNC.first={cfg:false,days:false,weights:false,foods:false};
  SHARE.cfg=null; SHARE.loaded=false; SHARE.last=''; SHARE.msg='';
}
function onCloudError(e){
  setSyncState((e&&e.code==='permission-denied')?'denied':'error');
}
function startCloud(user){
  stopCloud();
  setLink(user.uid);
  const m=FB.mods,fs=FB.fs,base=['users',user.uid];
  const ref=p=>m.doc.apply(null,[fs].concat(base,p.split('/')));
  const col=n=>m.collection.apply(null,[fs].concat(base,[n]));
  SYNC.db={doc:p=>({set:d=>m.setDoc(ref(p),d),delete:()=>m.deleteDoc(ref(p))})};
  SYNC.boot=bootNow();
  setSyncState('connecting');
  SYNC.offT=setTimeout(()=>{ if(!SYNC.ready) setSyncState('offline'); },10000);
  const opt={includeMetadataChanges:true};
  const err=e=>onCloudError(e);
  SYNC.unsubs=[
    m.onSnapshot(ref('cfg/main'),opt,s=>onCfg({exists:s.exists(),data:()=>s.data(),metadata:s.metadata}),err),
    m.onSnapshot(col('days'),opt,onDays,err),
    m.onSnapshot(col('weights'),opt,onWeights,err),
    m.onSnapshot(col('foods'),opt,onFoods,err)
  ];
  SYNC.unsubs.push(m.onSnapshot(ref('cfg/share'),opt,onShareCfg,err));
}
async function wipeCloud(uid,withShare){
  const m=FB.mods,fs=FB.fs;
  const refs=[m.doc(fs,'users',uid,'cfg','main')];
  if(withShare){
    const sref=m.doc(fs,'users',uid,'cfg','share');
    const ss=await m.getDocFromServer(sref);
    if(ss.exists()){
      const tk=ss.data()&&ss.data().token;
      if(typeof tk==='string'&&tk) refs.push(m.doc(fs,'shares',tk));
      refs.push(sref);
    }
  }
  for(const c of (withShare?['days','weights','foods','backups']:['days','weights','foods'])){
    const s=await m.getDocsFromServer(m.collection(fs,'users',uid,c));
    s.docs.forEach(d=>refs.push(d.ref));
  }
  for(let i=0;i<refs.length;i+=400){
    const b=m.writeBatch(fs);
    refs.slice(i,i+400).forEach(r=>b.delete(r));
    await b.commit();
  }
}

async function beginForUser(user){
  const gen=++FB.gen;
  setSyncState('connecting');
  const m=FB.mods,L=getLink();
  if(L===user.uid){ startCloud(user); return; }
  let cloudHas;
  try{
    const s=await m.getDocFromServer(m.doc(FB.fs,'users',user.uid,'cfg','main'));
    cloudHas=s.exists();
  }catch(e){
    if(gen!==FB.gen) return;
    if(e&&e.code==='permission-denied'){ setSyncState('denied'); return; }
    setSyncState('offline');
    authNote('Cần có mạng để đăng nhập lần đầu trên máy này. Khi có mạng lại app sẽ tự thử tiếp.');
    return;
  }
  if(gen!==FB.gen) return;
  const localHas=localHasData();
  if(!localHas||(!cloudHas&&L===null)){ startCloud(user); return; }
  if(L!==null&&L!==user.uid) askOther(user); else askBoth(user);
}
function onUser(user){
  AUTH.busy=false;
  if(!user){
    FB.gen++; FB.user=null; closeModal(); stopCloud();
    setSyncState('local'); authChanged();
    return;
  }
  if(FB.user&&FB.user.uid===user.uid&&SYNC.db) return;
  FB.user=user; authNote(''); authChanged();
  beginForUser(user);
}
async function signIn(){
  if(AUTH.busy) return;
  AUTH.busy=true; paintAuthUI(); authNote('');
  try{
    const m=FB.mods||await loadFB();
    await m.signInWithPopup(FB.auth,new m.GoogleAuthProvider());
  }catch(e){
    authNote(authErr(e));
    if(!FB.mods) setSyncState('nosdk');
  }
  AUTH.busy=false; paintAuthUI();
}
async function signOutPlain(){

  catch(e){ authNote('Không đăng xuất được. Hãy thử lại.'); }
}
async function signOutAndWipe(){
  const m=FB.mods;
  stopCloud();
  try{ await m.signOut(FB.auth); }catch(e){}
  clearLocal(); setLink(null);
  try{ await m.terminate(FB.fs); await m.clearIndexedDbPersistence(FB.fs); }catch(e){}

}
async function deleteCloud(){
  const user=FB.user;
  if(!user) return;
  authNote('Đang xóa dữ liệu trên đám mây…');
  stopCloud();
  try{
    await wipeCloud(user.uid,true);
    setLink(null);
    authNote('Đã xóa dữ liệu của bạn trên đám mây. Dữ liệu trên máy này vẫn còn. Bạn đã được đăng xuất.');
    await FB.mods.signOut(FB.auth);
  }catch(e){
    authNote('Chưa xóa được dữ liệu trên đám mây. Hãy kiểm tra mạng rồi thử lại.');

}
let authAttached=false;
async function attachAuth(){
  if(authAttached) return;
  try{
    const m=await loadFB();
    if(authAttached) return;
    authAttached=true;
    m.onAuthStateChanged(FB.auth,onUser);
  }catch(e){ setSyncState('nosdk'); }
