/* ---------- Sharing a read-only link ---------- */
const SHARE={cfg:null,loaded:false,last:'',msg:'',busy:false};
function shareState(){
  return JSON.parse(JSON.stringify({v:2,start:S.start,target:S.target,targetFrom:S.targetFrom,tasks:S.tasks,days:S.days,weights:S.weights||{},calGoal:S.calGoal!==false,prevTarget:S.prevTarget||null}));
}
function randomToken(){
  const c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  const a=new Uint8Array(24);
  if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(a); else for(let i=0;i<a.length;i++) a[i]=Math.floor(Math.random()*256);
  return Array.from(a,x=>c[x%62]).join('');
}
const shareLink=()=>location.origin+location.pathname+'#xem='+SHARE.cfg.token;
function onShareCfg(snap){
  const ex=snap.exists();
  if(snap.metadata&&snap.metadata.fromCache&&!ex) return;
  const d=ex?snap.data():null;
  const next=(d&&typeof d.token==='string'&&d.token)?{token:d.token,name:typeof d.name==='string'?d.name:''}:null;
  const changed=canon(next)!==canon(SHARE.cfg)||!SHARE.loaded;
  SHARE.cfg=next; SHARE.loaded=true;
  if(!next) SHARE.last='';
  if(changed&&tab==='edit') scheduleRender();
}
async function pushShare(force){
  const c=SHARE.cfg;
  if(!c||!c.token||!FB.user||!SYNC.ready||!SYNC.db||SHARE.busy) return;
  const state=shareState(),j=canon(state)+'|'+(c.name||'');
  if(!force&&j===SHARE.last) return;
  const m=FB.mods;
  try{
    await m.setDoc(m.doc(FB.fs,'shares',c.token),{owner:FB.user.uid,name:c.name||'',updated:Date.now(),state});
    SHARE.last=j;
    if(SHARE.msg){ SHARE.msg=''; if(tab==='edit') scheduleRender(); }
  }catch(e){
    SHARE.msg='Chưa cập nhật được bản chia sẻ'+(e&&e.code?' ('+e.code+')':'')+'.';
    if(tab==='edit') scheduleRender();
  }
}
setInterval(()=>pushShare(false),4000);
async function createShare(name){
  if(!FB.user||SHARE.busy) return;
  if(!SYNC.ready){ SHARE.msg='Hãy đợi app đồng bộ xong rồi thử lại.'; scheduleRender(); return; }
  const m=FB.mods,uid=FB.user.uid,token=randomToken();
  SHARE.busy=true; SHARE.msg='';
  try{
    const state=shareState();
    await m.setDoc(m.doc(FB.fs,'shares',token),{owner:uid,name,updated:Date.now(),state});
    await m.setDoc(m.doc(FB.fs,'users',uid,'cfg','share'),{token,name});
    SHARE.cfg={token,name}; SHARE.last=canon(state)+'|'+name;
  }catch(e){
    try{ await m.deleteDoc(m.doc(FB.fs,'shares',token)); }catch(x){}
    SHARE.cfg=null;
    SHARE.msg='Không tạo được liên kết'+(e&&e.code?' ('+e.code+')':'')+'. Hãy kiểm tra quy tắc bảo mật Firestore đã có phần "shares".';
  }
  SHARE.busy=false; scheduleRender();
}
async function saveShareName(name){
  if(!SHARE.cfg||!FB.user) return;
  const m=FB.mods;
  try{
    await m.setDoc(m.doc(FB.fs,'users',FB.user.uid,'cfg','share'),{token:SHARE.cfg.token,name});
    SHARE.cfg=Object.assign({},SHARE.cfg,{name});
    SHARE.msg='Đã lưu tên.';
    await pushShare(true);
  }catch(e){ SHARE.msg='Chưa lưu được tên.'; }
  scheduleRender();

async function revokeShare(){
  if(!SHARE.cfg||!FB.user) return;
  const m=FB.mods,tk=SHARE.cfg.token;

    await m.deleteDoc(m.doc(FB.fs,'shares',tk));

        msg,
        h('p',{class:'hint',text:'Ai có liên kết đều xem được. Nếu liên kết bị lộ, hãy tắt chia sẻ rồi tạo liên kết mới. Bản chia sẻ tự cập nhật khi bạn dùng app và đang đăng nhập.'}),
        h('div',{class:'btn-row full'},off));
    }
    if(!SHARE.cfg&&SHARE.msg) kids.push(h('p',{class:'msg',text:SHARE.msg}));
  }
  return h('section',{class:'group','aria-labelledby':'h-share'},kids);
}

/* ---------- Viewer (read-only link) ---------- */
function viewerMsg(text){
  mainEl.replaceChildren(h('div',{class:'note warn'},h('span',{text}),h('a',{href:location.pathname,text:'Mở app'})));
}
async function startViewer(){
  const head=document.querySelector('.synchead'); if(head) head.hidden=true;
  const eb=tabBtns.find(b=>b.dataset.tab==='edit'); if(eb) eb.hidden=true;
  mainEl.replaceChildren(h('p',{class:'hint',text:'Đang tải…'}));
  try{
    const m=await loadFB();
    const snap=await m.getDocFromServer(m.doc(FB.fs,'shares',VIEW_TOKEN));
    if(!snap.exists()){ viewerMsg('Liên kết này không còn hiệu lực. Hãy xin người chia sẻ một liên kết mới.'); return; }
    const d=snap.data()||{};
    const st=normalize(d.state);
    if(!st){ viewerMsg('Không đọc được dữ liệu chia sẻ.'); return; }
    S=st; setFoods([]);
    VIEW.name=typeof d.name==='string'?d.name.slice(0,30):'';
    VIEW.updated=Number(d.updated)||0;
    const dt=VIEW.updated?new Date(VIEW.updated):null;
    const when=dt?(pad(dt.getDate())+'/'+pad(dt.getMonth()+1)+'/'+dt.getFullYear()+' '+pad(dt.getHours())+':'+pad(dt.getMinutes())):'';
    const stale=dt&&(Date.now()-VIEW.updated>36*3600*1000);
    const banner=h('div',{class:'note',style:'margin-bottom:12px'},
      h('span',{text:'Chỉ xem'+(VIEW.name?' · của '+VIEW.name:'')+(when?'. Cập nhật lần cuối '+when+'.':'.')+(stale?' Dữ liệu có thể chưa mới.':'')}),
      h('a',{href:location.pathname,text:'Dùng thử app'}));
    mainEl.before(banner);
    document.title='Challenge 30 ngày'+(VIEW.name?' · '+VIEW.name:'');
    tab=tabFromHash(); render();
  }catch(e){
    viewerMsg((e&&e.code==='unavailable')?'Không có kết nối mạng. Hãy thử lại khi có mạng.':'Không tải được dữ liệu chia sẻ. Hãy kiểm tra mạng rồi tải lại trang.');
  }
}

/* ---------- Automatic backups ---------- */
const BK_KEY='challenge30.bk';
const BK={cloud:null,cloudAt:0,busy:false,cretry:0};
const bkRead=()=>{
  try{ const o=JSON.parse(localStorage.getItem(BK_KEY)||'null'); if(o&&Array.isArray(o.days)) return {days:o.days,pre:o.pre||null,done:o.done||'',cdone:o.cdone||{}}; }catch(e){}
  return {days:[],pre:null,done:'',cdone:{}};
};
function bkWrite(o){
  try{ localStorage.setItem(BK_KEY,JSON.stringify(o)); return true; }catch(e){}
  try{ // too big: keep the foods only on the newest daily copy
    o.days.forEach((d,i)=>{ if(i>0) d.f='[]'; });
    localStorage.setItem(BK_KEY,JSON.stringify(o)); return true;
  }catch(e){ return false; }
}
function bkSnap(){ return {at:Date.now(),s:JSON.stringify(S),f:JSON.stringify(FOODS),n:{d:Object.keys(S.days).length,f:FOODS.length}}; }
function bkPayload(sn){
  let p=JSON.stringify({s:JSON.parse(sn.s),f:JSON.parse(sn.f)});
  let noFoods=false;
  if(p.length>900000){ p=JSON.stringify({s:JSON.parse(sn.s),f:[]}); noFoods=true; }
  return {payload:p,noFoods};
}
async function bkCloudSet(id,kind,extra,sn){
  const m=FB.mods,fs=FB.fs,u=FB.user;
  if(!m||!fs||!u) throw {code:'nouser'};
  const pl=bkPayload(sn);
  const doc=Object.assign({kind,at:sn.at,n:sn.n,payload:pl.payload,noFoods:pl.noFoods},extra||{});
  await m.setDoc(m.doc(fs,'users',u.uid,'backups',id),doc);
  BK.cloud=null; BK.cloudAt=0;
}
async function bkCloudList(){
  const m=FB.mods,fs=FB.fs,u=FB.user;
  const s=await m.getDocsFromServer(m.collection(fs,'users',u.uid,'backups'));
  const list=s.docs.map(d=>{ const x=d.data()||{}; return {id:d.id,kind:x.kind,day:x.day||'',at:Number(x.at)||0,why:x.why||'',n:x.n||{d:0,f:0}}; });
  BK.cloud=list; BK.cloudAt=Date.now();
  return list;
}
async function bkCloudDaily(day){
  const list=await bkCloudList();
  if(list.some(x=>x.kind==='daily'&&x.day===day)) return;
  const ids=['d0','d1','d2'];
  let pick=ids.find(id=>!list.some(x=>x.id===id));
  if(!pick){
    const mine=list.filter(x=>ids.indexOf(x.id)>=0).sort((a,b)=>a.day<b.day?-1:a.day>b.day?1:0);
    pick=mine[0].id;
  }
  await bkCloudSet(pick,'daily',{day},bkSnap());
}
function bkLocalDaily(day){
  const o=bkRead(),sn=bkSnap();
  o.days=o.days.filter(d=>d.day!==day);
  o.days.unshift({day,at:sn.at,s:sn.s,f:sn.f,n:sn.n});
  o.days.sort((a,b)=>a.day<b.day?1:a.day>b.day?-1:0);
  o.days=o.days.slice(0,3);
  o.done=day;
  bkWrite(o);
}
async function bkTick(){
  if(READONLY||BK.busy||document.hidden) return;
  BK.busy=true;
  try{
    const day=todayKey();
    const has=localHasData();
    const signed=!!FB.user;
    const synced=signed&&SYNC.ready&&SYNC.state==='ok';
    if(has&&bkRead().done!==day&&(!signed||synced||performance.now()>30000)) bkLocalDaily(day);
    if(has&&synced&&Date.now()>=BK.cretry){
      const uid=FB.user.uid;
      if((bkRead().cdone||{})[uid]!==day){
        try{
          await bkCloudDaily(day);
          const o=bkRead(); o.cdone=o.cdone||{}; o.cdone[uid]=day; bkWrite(o);
        }catch(e){ BK.cretry=Date.now()+60000; }
      }
    }
  }catch(e){}
  BK.busy=false;
}
/* A copy taken right before something replaces the data */
function bkPre(why){
  const sn=bkSnap();
  const o=bkRead(); o.pre={at:sn.at,why,s:sn.s,f:sn.f,n:sn.n}; bkWrite(o);
  if(FB.user&&SYNC.ready) bkCloudSet('pre','pre',{why},sn).catch(()=>{});
  return sn;
}
function bkApply(sn){
  const st=normalize(JSON.parse(sn.s));
  if(!st) return false;
  S=st; viewKey=null; calSel=null;
  try{ setFoods(JSON.parse(sn.f)); }catch(e){}
  saveFoods(); save();
  return true;
}

/* Undo bar */
let undoT=0;
function closeUndo(){ clearInterval(undoT); const u=document.querySelector('.undo'); if(u) u.remove(); }
function showUndo(text,sn){
  closeUndo();
  let left=(typeof window.__undoSecs==='number')?window.__undoSecs:20;
  const b=h('button',{class:'btn',type:'button'},'Hoàn tác ('+left+')');
  const bar=h('div',{class:'undo',role:'status'},h('span',{text}),b);
  b.addEventListener('click',()=>{
    closeUndo();
    try{ if(bkApply(sn)){ render(); } }catch(e){}
  });
  document.body.append(bar);
  undoT=setInterval(()=>{
    left--;
    if(left<=0){ closeUndo(); return; }
    b.textContent='Hoàn tác ('+left+')';
  },1000);
}
function doWithUndo(text,fn){
  const sn=bkPre('replace');
  fn();
  showUndo(text,sn);
}

/* Reset: confirmation that cannot be tapped through */
function askReset(){
  let left=(typeof window.__resetWait==='number')?window.__resetWait:10;
  const gob=h('button',{class:'btn danger small',type:'button',disabled:left>0},left>0?'Xóa hết ('+left+')':'Xóa hết');
  const keep=dlgBtn('Giữ lại dữ liệu','primary',closeModal);
  gob.addEventListener('click',()=>{
    if(gob.disabled) return;
    closeModal();
    doWithUndo('Đã xóa toàn bộ dữ liệu challenge.',()=>{ S=fresh(); viewKey=null; save(); go('today'); });
  });
  const paras=[
    'App sẽ xóa việc đã làm, bữa ăn, cân nặng, mục tiêu và cấu hình challenge. Bảng thực phẩm được giữ nguyên.',
    FB.user?'Bạn đang đăng nhập nên dữ liệu trên đám mây và ở mọi thiết bị cũng bị xóa theo.':'Dữ liệu chỉ nằm trên máy này nên xóa là mất.',
    'Trước khi xóa, app tự lưu một bản để khôi phục trong Cấu hình → Sao lưu. Sau khi xóa bạn còn 20 giây để bấm Hoàn tác.'
  ];
  modal('Xóa toàn bộ dữ liệu challenge?',paras,[keep,gob]);
  const t=setInterval(()=>{
    if(!document.body.contains(gob)){ clearInterval(t); return; }
    left--;
    if(left>0) gob.textContent='Xóa hết ('+left+')';
    else{ clearInterval(t); gob.disabled=false; gob.textContent='Xóa hết'; }
  },1000);
}

/* Backup list in Cấu hình → Sao lưu */
const bkFmt=ts=>{ const d=new Date(ts); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes()); };
function bkEntries(){
  const o=bkRead(),map=new Map();
  const put=(key,kind,day,at,n,why,patch)=>{
    const e=map.get(key)||{key,kind,day,at,n,why,local:false,cloud:false};
    if(at>=e.at){ e.at=at; e.n=n; e.why=why; }
    Object.assign(e,patch); map.set(key,e);
  };
  o.days.forEach(d=>put('d:'+d.day,'daily',d.day,d.at,d.n||{d:0,f:0},'',{local:true}));
  if(o.pre) put('pre','pre','',o.pre.at,o.pre.n||{d:0,f:0},o.pre.why||'',{local:true});
  (BK.cloud||[]).forEach(c=>{
    if(c.kind==='pre') put('pre','pre','',c.at,c.n,c.why,{cloud:true,cid:c.id});
    else if(c.kind==='daily') put('d:'+c.day,'daily',c.day,c.at,c.n,'',{cloud:true,cid:c.id});
  });
  const all=Array.from(map.values()).sort((a,b)=>a.kind==='pre'?-1:b.kind==='pre'?1:(a.day<b.day?1:a.day>b.day?-1:0));
  const pre=all.filter(e=>e.kind==='pre'),daily=all.filter(e=>e.kind!=='pre').slice(0,3);
  return pre.concat(daily);
}
async function bkLoad(e){
  const o=bkRead();
  if(e.local){
    if(e.kind==='pre'&&o.pre) return {s:o.pre.s,f:o.pre.f};
    const d=o.days.find(x=>x.day===e.day); if(d) return {s:d.s,f:d.f};
  }
  const m=FB.mods;
  const s=await m.getDocFromServer(m.doc(FB.fs,'users',FB.user.uid,'backups',e.cid));
  const x=s.exists()?s.data():null;
  const p=x&&JSON.parse(x.payload);
  if(!p) throw {code:'missing'};
  return {s:JSON.stringify(p.s),f:JSON.stringify(p.f||[])};
}
function backupSection(){
  const box=h('div',{class:'bkbox'});
  const msg=h('p',{class:'msg'});
  const head=h('p',{class:'hint',text:'Mỗi ngày mở app, app tự lưu 1 bản toàn bộ dữ liệu (giữ 3 ngày gần nhất, bản mới ghi đè bản cũ nhất) trên máy này'+(FB.user?' và trên đám mây.':'. Đăng nhập để có thêm bản trên đám mây.')+' Ngoài ra có 1 bản tự lưu ngay trước khi xóa hoặc khôi phục.'});
  const rows=h('div',{class:'bkbox'});
  function paint(){
    const es=bkEntries();
    rows.replaceChildren(...(es.length?es.map(e=>{
      const title=e.kind==='pre'?'Trước khi xóa hoặc khôi phục · '+bkFmt(e.at):'Ngày '+e.day.slice(8)+'/'+e.day.slice(5,7)+' · '+bkFmt(e.at).slice(6);
      const src=[e.cloud?'đám mây':null,e.local?'máy này':null].filter(Boolean).join(' + ');
      const b=h('button',{class:'btn',type:'button'},'Khôi phục');
      arm(b,'Khôi phục','Chắc chắn?',async()=>{
        b.textContent='Khôi phục'; b.classList.remove('armed');
        try{
          const sn=await bkLoad(e);
          const st=normalize(JSON.parse(sn.s));
          if(!st){ msg.textContent='Bản sao lưu này không đọc được.'; return; }
          doWithUndo('Đã khôi phục bản sao lưu.',()=>{ bkApply(sn); render(); });
        }catch(err){ msg.textContent='Chưa lấy được bản sao lưu. Hãy kiểm tra mạng rồi thử lại.'; }
      });
      return h('div',{class:'bkrow'},h('div',{class:'bt'},h('b',{text:title}),h('span',{text:(e.n.d||0)+' ngày dữ liệu · '+(e.n.f||0)+' món · '+src})),b);
    }):[h('p',{class:'hint',text:'Chưa có bản tự động nào. Bản đầu tiên sẽ được lưu khi bạn mở app có dữ liệu.'})]));
  }
  box.append(head,rows,msg);
  paint();
  if(FB.user&&SYNC.ready&&Date.now()-BK.cloudAt>60000) bkCloudList().then(paint,()=>{});
  return box;
}
if(!READONLY){
  setInterval(bkTick,5000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) bkTick(); });
  window.__bkTick=bkTick;
}

setSyncState('local');

function tick(){ const t=todayKey(); if(t!==lastToday){ lastToday=t; render(); } }
setInterval(tick,60000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) tick(); });

tab=tabFromHash();
if(READONLY) startViewer(); else{ render(); initAuth(); }
})();
